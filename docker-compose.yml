version: '3.8'

services:
  gocms:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./runtime:/app/runtime
      - ./web:/app/web
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3

