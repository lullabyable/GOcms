<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>卡密管理</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline"><input type="text" autocomplete="off" placeholder="卡密编码" class="layui-input" name="wd"></div>
                <div class="layui-input-inline">
                    <select name="status">
                        <option value="">全部状态</option>
                        <option value="0">未使用</option>
                        <option value="1">已使用</option>
                    </select>
                </div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="showGenerate()"><i class="layui-icon">&#xe654;</i>生成卡密</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="40">ID</th>
                <th width="200">卡密编码</th>
                <th width="80">类型</th>
                <th width="80">面值</th>
                <th width="80">状态</th>
                <th width="80">关联订单</th>
                <th width="150">使用时间</th>
                <th width="150">创建时间</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>

<!-- 生成卡密弹窗 -->
<div id="generateBox" style="display:none;padding:20px;">
    <form class="layui-form" id="generateForm">
        <div class="layui-form-item">
            <label class="layui-form-label">类型</label>
            <div class="layui-input-inline">
                <select name="card_type">
                    <option value="1">充值卡</option>
                    <option value="2">会员卡</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">面值</label>
            <div class="layui-input-inline"><input type="number" class="layui-input" name="card_value" value="10"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">数量</label>
            <div class="layui-input-inline"><input type="number" class="layui-input" name="count" value="1"></div>
        </div>
    </form>
</div>

<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var currentPage=1,pageLimit=20;

    function loadData(page){
        currentPage=page||1;
        var fd={};
        new FormData(document.getElementById('searchForm')).forEach(function(v,k){if(v)fd[k]=v;});
        fd.page=currentPage;fd.limit=pageLimit;
        var qs=Object.keys(fd).map(function(k){return k+'='+encodeURIComponent(fd[k]);}).join('&');
        API.get('/admin/order/cards?'+qs).then(function(r){
            if(r.code===1){
                renderTable(r.data.list||[]);
                renderPag(r.data.total||0);
            }
        });
    }

    function renderTable(list){
        var h='';
        list.forEach(function(vo){
            var status=vo.card_status==1?'<span class="layui-badge layui-bg-green">已使用</span>':'<span class="layui-badge">未使用</span>';
            var types={'1':'充值卡','2':'会员卡'};
            var typeName=types[vo.card_type]||vo.card_type;
            h+='<tr>';
            h+='<td>'+vo.card_id+'</td>';
            h+='<td>'+htmlspecialchars(vo.card_code||'')+'</td>';
            h+='<td>'+typeName+'</td>';
            h+='<td>'+vo.card_value+'</td>';
            h+='<td>'+status+'</td>';
            h+='<td>'+(vo.card_order_id||'-')+'</td>';
            h+='<td>'+(vo.card_use_time?mac_day(vo.card_use_time,'color'):'-')+'</td>';
            h+='<td>'+mac_day(vo.card_time,'color')+'</td>';
            h+='</tr>';
        });
        document.getElementById('tableBody').innerHTML=h;
        layui.use('form',function(){layui.form.render();});
    }

    function renderPag(total){
        layui.use(['laypage'],function(){
            layui.laypage.render({
                elem:'pages',count:total,limit:pageLimit,curr:currentPage,
                layout:['count','prev','page','next','limit','skip'],
                jump:function(o,f){if(!f)loadData(o.curr);}
            });
        });
    }

    function doSearch(){loadData(1);}

    function showGenerate(){
        layui.use('layer',function(){
            layui.layer.open({
                type:1,title:'生成卡密',area:['400px','300px'],
                content:document.getElementById('generateBox'),
                btn:['生成','取消'],
                yes:function(index){
                    var f=document.getElementById('generateForm');
                    var data={
                        card_type:f.querySelector('[name=card_type]').value,
                        card_value:f.querySelector('[name=card_value]').value,
                        count:f.querySelector('[name=count]').value
                    };
                    API.post('/admin/order/cards/generate',data).then(function(r){
                        layui.layer.msg(r.msg||'生成完成',{time:2000});
                        if(r.code===1){
                            layui.layer.close(index);
                            loadData(currentPage);
                        }
                    });
                }
            });
        });
    }

    loadData(1);
    initTable({total:0,limit:pageLimit,page:1,onPageChange:function(p,l){pageLimit=l;loadData(p);}});
</script>
</body>
</html>
