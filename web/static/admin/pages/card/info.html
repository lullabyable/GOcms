<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>卡密详情</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-16">卡密详情</p></blockquote>
    <div id="detailBox" style="padding:20px;">加载中...</div>
    <div class="center mt20">
        <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
    </div>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script>
var itemId=getQueryParam('id');
function loadDetail(){
    if(!itemId){
        document.getElementById('detailBox').innerHTML='<p class="text-danger">未指定卡密ID</p>';
        return;
    }
    API.get('/admin/order/cards/'+itemId).then(function(r){
        if(r.code===1&&r.data){
            var vo=r.data;
            var status=vo.card_status==1?'已使用':'未使用';
            var types={'1':'充值卡','2':'会员卡'};
            var typeName=types[vo.card_type]||vo.card_type;
            var html='<table class="layui-table">';
            html+='<tr><td width="120">卡密ID</td><td>'+vo.card_id+'</td></tr>';
            html+='<tr><td>卡密编码</td><td>'+htmlspecialchars(vo.card_code||'')+'</td></tr>';
            html+='<tr><td>类型</td><td>'+typeName+'</td></tr>';
            html+='<tr><td>面值</td><td>'+vo.card_value+'</td></tr>';
            html+='<tr><td>状态</td><td>'+status+'</td></tr>';
            html+='<tr><td>关联订单</td><td>'+(vo.card_order_id||'无')+'</td></tr>';
            html+='<tr><td>使用时间</td><td>'+(vo.card_use_time?mac_day(vo.card_use_time):'未使用')+'</td></tr>';
            html+='<tr><td>创建时间</td><td>'+mac_day(vo.card_time)+'</td></tr>';
            html+='</table>';
            document.getElementById('detailBox').innerHTML=html;
        }else{
            document.getElementById('detailBox').innerHTML='<p class="text-danger">加载失败</p>';
        }
    });
}
loadDetail();
</script>
</body>
</html>
