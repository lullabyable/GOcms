<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>模板管理</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
    <style>
        .editor-wrap { display:none; margin-top: 10px; }
        .editor-wrap textarea { width: 100%; height: 400px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.5; }
        .breadcrumb { padding: 8px 0; margin-bottom: 10px; font-size: 14px; }
        .breadcrumb a { color: #1E9FFF; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb span { color: #999; margin: 0 5px; }
        .file-icon { margin-right: 5px; }
    </style>
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="breadcrumb" id="breadcrumb"></div>
    </div>
    <table class="layui-table" lay-size="sm">
        <thead><tr>
            <th>文件名</th>
            <th width="100">类型</th>
            <th width="100">大小</th>
            <th width="160">修改时间</th>
            <th width="150">操作</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
    </table>

    <!-- 编辑器弹层 -->
    <div class="editor-wrap" id="editorWrap">
        <div style="margin-bottom:10px;">
            <strong id="editFileName"></strong>
            <a href="javascript:;" class="layui-btn layui-btn-sm layui-btn-normal" style="float:right;" onclick="saveFile()">保存</a>
            <a href="javascript:;" class="layui-btn layui-btn-sm layui-btn-primary" style="float:right;margin-right:10px;" onclick="closeEditor()">关闭</a>
        </div>
        <textarea id="editorContent"></textarea>
    </div>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var currentPath = '';
    var editingPath = '';

    function loadFiles(path) {
        currentPath = path || '';
        var url = '/admin/template/list';
        if (currentPath) url += '?path=' + encodeURIComponent(currentPath);
        API.get(url).then(function(r) {
            if (r.code === 1 && r.data) {
                renderBreadcrumb(r.data.path || '');
                renderTable(r.data.files || []);
            }
        });
    }

    function renderBreadcrumb(path) {
        var html = '<a href="javascript:;" onclick="loadFiles(\'\')">根目录</a>';
        if (path && path !== '.') {
            var parts = path.split(/[/\\]/);
            var accumulated = '';
            parts.forEach(function(part, idx) {
                if (part === '.' || !part) return;
                accumulated += (accumulated ? '/' : '') + part;
                html += '<span>/</span><a href="javascript:;" onclick="loadFiles(\'' + accumulated + '\')">' + part + '</a>';
            });
        }
        document.getElementById('breadcrumb').innerHTML = html;
    }

    function renderTable(list) {
        var h = '';
        // 如果在子目录，显示返回上级
        if (currentPath && currentPath !== '.') {
            var parentPath = currentPath.replace(/[/\\][^/\\]+$/, '') || '';
            h += '<tr><td><a href="javascript:;" onclick="loadFiles(\'' + parentPath + '\')"><i class="layui-icon file-icon">&#xe65e;</i>..</a></td><td>目录</td><td>-</td><td>-</td><td>-</td></tr>';
        }
        list.forEach(function(vo) {
            h += '<tr>';
            if (vo.is_dir) {
                var dirPath = currentPath ? currentPath + '/' + vo.name : vo.name;
                h += '<td><a href="javascript:;" onclick="loadFiles(\'' + dirPath + '\')"><i class="layui-icon file-icon" style="color:#FFB800;">&#xe65e;</i>' + htmlspecialchars(vo.name) + '</a></td>';
                h += '<td>目录</td><td>-</td>';
            } else {
                h += '<td><i class="layui-icon file-icon" style="color:#1E9FFF;">&#xe66c;</i>' + htmlspecialchars(vo.name) + '</td>';
                h += '<td>文件</td><td>' + (vo.size_str || '-') + '</td>';
            }
            h += '<td>' + mac_day(vo.mod_time) + '</td>';
            h += '<td>';
            if (!vo.is_dir) {
                h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-primary" onclick="openFile(\'' + vo.path + '\')">编辑</a> ';
            }
            h += '</td></tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
    }

    function openFile(path) {
        editingPath = path;
        API.get('/admin/template/read?path=' + encodeURIComponent(path)).then(function(r) {
            if (r.code === 1 && r.data) {
                document.getElementById('editFileName').textContent = path;
                document.getElementById('editorContent').value = r.data.content || '';
                document.getElementById('editorWrap').style.display = 'block';
                window.scrollTo(0, document.getElementById('editorWrap').offsetTop);
            } else {
                layui.use('layer', function() { layui.layer.msg(r.msg || '读取失败', {time: 2000}); });
            }
        });
    }

    function saveFile() {
        if (!editingPath) return;
        var content = document.getElementById('editorContent').value;
        var fd = new FormData();
        fd.append('path', editingPath);
        fd.append('content', content);
        layui.use('layer', function() {
            layui.layer.msg('正在保存...', {time: 30000});
            API.form('/admin/template/save', fd).then(function(r) {
                layui.layer.closeAll();
                layui.layer.msg(r.msg || (r.code === 1 ? '保存成功' : '保存失败'), {time: 2000});
            }).catch(function() {
                layui.layer.closeAll();
                layui.layer.msg('保存失败', {time: 2000});
            });
        });
    }

    function closeEditor() {
        document.getElementById('editorWrap').style.display = 'none';
        editingPath = '';
    }

    loadFiles('');
</script>
</body>
</html>
