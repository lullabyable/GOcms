<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>系统设置</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container">
    <div class="showpic" style="display:none;"><img class="showpic_img" width="120" height="160" referrerPolicy="no-referrer"></div>
    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="site[new_version]" value="">
        <div class="layui-tab" lay-filter="tb1">
            <ul class="layui-tab-title">
                <li class="layui-this" lay-id="config_1">基本设置</li>
                <li lay-id="config_2">性能优化</li>
                <li lay-id="config_3">参数设置</li>
                <li lay-id="config_4">后台设置</li>
            </ul>
            <div class="layui-tab-content">
                <!-- 基本设置 -->
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label">站点名称：</label>
                        <div class="layui-input-block"><input type="text" name="site[site_name]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">站点网址：</label>
                        <div class="layui-input-block"><input type="text" name="site[site_url]" placeholder="例：http://www.example.com" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">手机网址：</label>
                        <div class="layui-input-block"><input type="text" name="site[site_wapurl]" placeholder="例：http://m.example.com" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">站点关键词：</label>
                        <div class="layui-input-block"><input type="text" name="site[site_keywords]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">站点描述：</label>
                        <div class="layui-input-block"><input type="text" name="site[site_description]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">ICP备案号：</label>
                        <div class="layui-input-block"><input type="text" name="site[site_icp]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">站点QQ：</label>
                        <div class="layui-input-block"><input type="text" name="site[site_qq]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">站点邮箱：</label>
                        <div class="layui-input-block"><input type="text" name="site[site_email]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">安装目录：</label>
                        <div class="layui-input-block"><input type="text" name="site[install_dir]" placeholder="留空表示根目录" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">站点Logo：</label>
                        <div class="layui-input-inline w600"><input type="text" name="site[site_logo]" placeholder="图片地址" value="" class="layui-input upload-input"></div>
                        <div class="layui-input-inline"><button type="button" class="layui-btn layui-upload" id="upload1">上传图片</button></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">手机Logo：</label>
                        <div class="layui-input-inline w600"><input type="text" name="site[site_waplogo]" placeholder="图片地址" value="" class="layui-input upload-input"></div>
                        <div class="layui-input-inline"><button type="button" class="layui-btn layui-upload" id="upload2">上传图片</button></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">模板目录：</label>
                        <div class="layui-input-inline"><select class="w150" name="site[template_dir]" id="template_dir"></select></div>
                        <label class="layui-form-label">生成目录：</label>
                        <div class="layui-input-inline"><input type="text" name="site[html_dir]" value="" class="layui-input w150"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">Polyfill：</label>
                        <div class="layui-input-inline w300">
                            <input type="radio" name="site[site_polyfill]" value="0" title="关闭">
                            <input type="radio" name="site[site_polyfill]" value="1" title="开启" checked>
                        </div>
                        <div class="layui-form-mid layui-word-aux">是否加载浏览器兼容脚本</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">手机端：</label>
                        <div class="layui-input-inline w300">
                            <input type="radio" name="site[mob_status]" value="0" title="关闭">
                            <input type="radio" name="site[mob_status]" value="1" title="多模板" checked>
                            <input type="radio" name="site[mob_status]" value="2" title="单模板">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">统计代码：</label>
                        <div class="layui-input-block"><textarea name="site[site_tj]" class="layui-textarea"></textarea></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">站点状态：</label>
                        <div class="layui-input-block">
                            <input type="radio" name="site[site_status]" value="0" title="关闭">
                            <input type="radio" name="site[site_status]" value="1" title="开启" checked>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">关闭提示：</label>
                        <div class="layui-input-block"><textarea name="site[site_close_tip]" class="layui-textarea"></textarea></div>
                    </div>
                </div>

                <!-- 性能优化 -->
                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">URL模式：</label>
                        <div class="layui-input-inline w150">
                            <select class="w150" name="app[pathinfo_depr]">
                                <option value="/">斜杠 /</option>
                                <option value="-">横杠 -</option>
                                <option value="_">下划线 _</option>
                            </select>
                        </div>
                        <div class="layui-form-mid layui-word-aux">URL路径分隔符</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">URL后缀：</label>
                        <div class="layui-input-inline">
                            <select style="width:150px;" name="app[suffix]">
                                <option value="html">html</option>
                                <option value="htm">htm</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">缓存类型：</label>
                        <div class="layui-input-block">
                            <input type="radio" name="app[cache_type]" lay-filter="cache_type" value="file" title="file" checked>
                            <input type="radio" name="app[cache_type]" lay-filter="cache_type" value="memcache" title="memcache">
                            <input type="radio" name="app[cache_type]" lay-filter="cache_type" value="redis" title="redis">
                            <input type="radio" name="app[cache_type]" lay-filter="cache_type" value="memcached" title="memcached">
                        </div>
                    </div>
                    <div class="layui-form-item row_cache_server" style="display:none;">
                        <label class="layui-form-label">缓存主机：</label>
                        <div class="layui-input-inline w150"><input type="text" name="app[cache_host]" placeholder="127.0.0.1" value="" class="layui-input"></div>
                        <label class="layui-form-label">端口：</label>
                        <div class="layui-input-inline w150"><input type="text" name="app[cache_port]" placeholder="6379" value="" class="layui-input"></div>
                        <label class="layui-form-label">用户名：</label>
                        <div class="layui-input-inline"><input type="text" name="app[cache_username]" value="" class="layui-input"></div>
                        <label class="layui-form-label">密码：</label>
                        <div class="layui-input-inline"><input type="text" name="app[cache_password]" value="" class="layui-input"></div>
                        <label class="layui-form-label">DB：</label>
                        <div class="layui-input-inline w150"><input type="text" name="app[cache_db]" placeholder="0" value="0" class="layui-input"></div>
                        <button type="button" class="layui-btn layui-btn-normal" onclick="testCache()">测试连接</button>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">缓存标识：</label>
                        <div class="layui-input-inline"><input type="text" name="app[cache_flag]" placeholder="自动生成" value="" class="layui-input w150"></div>
                        <div class="layui-form-mid layui-word-aux">缓存标识变更后会自动清理缓存</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">核心缓存：</label>
                        <div class="layui-input-block">
                            <input type="radio" name="app[cache_core]" value="0" title="关闭" checked>
                            <input type="radio" name="app[cache_core]" value="1" title="开启">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">缓存时间：</label>
                        <div class="layui-input-inline"><input type="text" name="app[cache_time]" value="" class="layui-input w150"></div>
                        <div class="layui-form-mid layui-word-aux">单位：秒</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">页面缓存：</label>
                        <div class="layui-input-block">
                            <input type="radio" name="app[cache_page]" value="0" title="关闭" checked>
                            <input type="radio" name="app[cache_page]" value="1" title="开启">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">页面缓存时间：</label>
                        <div class="layui-input-inline"><input type="text" name="app[cache_time_page]" value="" class="layui-input w150"></div>
                        <div class="layui-form-mid layui-word-aux">单位：秒</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">JS/CSS压缩：</label>
                        <div class="layui-input-block">
                            <input type="radio" name="app[compress]" value="0" title="关闭" checked>
                            <input type="radio" name="app[compress]" value="1" title="开启">
                        </div>
                    </div>
                </div>

                <!-- 参数设置 -->
                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">播放器排序：</label>
                        <div class="layui-input-inline">
                            <input type="radio" name="app[player_sort]" value="0" title="添加" checked>
                            <input type="radio" name="app[player_sort]" value="1" title="全局">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">播放加密：</label>
                        <div class="layui-input-inline">
                            <select style="width:150px;" name="app[encrypt]">
                                <option value="0">不加密</option>
                                <option value="1">escape</option>
                                <option value="2">base64</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">热门搜索：</label>
                        <div class="layui-input-block"><input type="text" name="app[search_hot]" placeholder="多个用逗号分隔" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">视频分类：</label>
                        <div class="layui-input-block"><input type="text" name="app[vod_extend_class]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">视频状态：</label>
                        <div class="layui-input-block"><input type="text" name="app[vod_extend_state]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">视频地区：</label>
                        <div class="layui-input-block"><input type="text" name="app[vod_extend_area]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">视频语言：</label>
                        <div class="layui-input-block"><input type="text" name="app[vod_extend_lang]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">视频年份：</label>
                        <div class="layui-input-block"><input type="text" name="app[vod_extend_year]" value="" class="layui-input"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">过滤词：</label>
                        <div class="layui-input-block"><textarea name="app[filter_words]" class="layui-textarea" placeholder="多个用逗号分隔"></textarea></div>
                    </div>
                </div>

                <!-- 后台设置 -->
                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">采集间隔：</label>
                        <div class="layui-input-inline"><input type="text" name="app[collect_timespan]" value="" class="layui-input w150"></div>
                        <div class="layui-form-mid layui-word-aux">单位：秒</div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">分页大小：</label>
                        <div class="layui-input-block"><input type="text" name="app[pagesize]" placeholder="默认20" value="" class="layui-input w150"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">生成数量：</label>
                        <div class="layui-input-block"><input type="text" name="app[makesize]" placeholder="默认10" value="" class="layui-input w150"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">登录验证码：</label>
                        <div class="layui-input-block">
                            <input type="radio" name="app[admin_login_verify]" value="0" title="关闭">
                            <input type="radio" name="app[admin_login_verify]" value="1" title="开启" checked>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">编辑器：</label>
                        <div class="layui-input-inline">
                            <select style="width:150px;" name="app[editor]" id="editorSelect">
                                <option value="ueditor">UEditor</option>
                                <option value="kindeditor">KindEditor</option>
                                <option value="ckeditor">CKEditor</option>
                                <option value="tinymce">TinyMCE</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">语言：</label>
                        <div class="layui-input-inline">
                            <select class="w150" name="app[lang]" id="langSelect">
                                <option value="zh-cn">zh-cn</option>
                                <option value="en">en</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 保存按钮 -->
                <div class="layui-form-item center">
                    <div class="layui-input-block">
                        <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                        <button class="layui-btn layui-btn-warm" type="reset">重置</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script type="text/javascript">
    // 加载配置数据
    API.get('/admin/system/config').then(function(r) {
        if (r.code === 1 && r.data) {
            var config = r.data;
            var form = document.getElementById('editForm');

            // 扁平化配置对象
            function flattenConfig(obj, prefix) {
                prefix = prefix || '';
                var result = {};
                Object.keys(obj).forEach(function(k) {
                    var key = prefix ? prefix + '[' + k + ']' : k;
                    if (typeof obj[k] === 'object' && obj[k] !== null && !Array.isArray(obj[k])) {
                        var sub = flattenConfig(obj[k], key);
                        Object.keys(sub).forEach(function(sk) { result[sk] = sub[sk]; });
                    } else {
                        result[key] = obj[k];
                    }
                });
                return result;
            }

            var flat = flattenConfig(config);
            Object.keys(flat).forEach(function(k) {
                var el = form.querySelector('[name="' + k + '"]');
                if (el) {
                    if (el.type === 'checkbox') {
                        el.checked = !!flat[k];
                    } else if (el.type === 'radio') {
                        form.querySelectorAll('[name="' + k + '"]').forEach(function(rd) {
                            rd.checked = (rd.value == flat[k]);
                        });
                    } else {
                        el.value = flat[k] || '';
                    }
                }
            });

            // 加载模板列表
            if (config.templates) {
                var tplSelect = document.getElementById('template_dir');
                tplSelect.innerHTML = '';
                config.templates.forEach(function(t) {
                    tplSelect.innerHTML += '<option value="' + t + '"' + (config.site && config.site.template_dir === t ? ' selected' : '') + '>' + t + '</option>';
                });
            }

            layui.use('form', function() {
                layui.form.render();

                // 缓存类型切换
                layui.form.on('radio(cache_type)', function(data) {
                    document.querySelector('.row_cache_server').style.display =
                        (data.value === 'memcache' || data.value === 'redis' || data.value === 'memcached') ? '' : 'none';
                });

                // 初始化缓存类型显示
                var checkedCache = form.querySelector('input[name="app[cache_type]"]:checked');
                if (checkedCache && checkedCache.value !== 'file' && checkedCache.value !== '0') {
                    document.querySelector('.row_cache_server').style.display = '';
                }
            });
        }
    });

    // Tab 记忆
    layui.use(['element'], function() {
        var element = layui.element;
        element.on('tab(tb1)', function() {
            try { localStorage.setItem('config_tab', this.getAttribute('lay-id')); } catch(e) {}
        });
        var saved = localStorage.getItem('config_tab');
        if (saved) {
            try { element.tabChange('tb1', saved); } catch(e) {}
        }
    });

    // 上传
    layui.use('upload', function() {
        var upload = layui.upload;
        upload.render({
            elem: '.layui-upload',
            url: '/admin/upload',
            method: 'post',
            before: function() { layui.layer.msg("上传中...", {time: 3000000}); },
            done: function(res) {
                layui.layer.closeAll();
                if (res.code === 1) {
                    var input = this.item.closest('.layui-form-item').querySelector('.upload-input');
                    if (input) input.value = res.data.file;
                } else {
                    layui.layer.msg(res.msg || '上传失败');
                }
            }
        });
    });

    // 图片预览
    document.querySelectorAll('.upload-input').forEach(function(el) {
        el.addEventListener('mouseenter', function(e) {
            var imgsrc = this.value;
            if (!imgsrc || !imgsrc.trim()) return;
            var showpic = document.querySelector('.showpic');
            showpic.style.left = (e.clientX + 20) + 'px';
            showpic.style.top = (e.clientY + 20) + 'px';
            showpic.style.display = '';
            if (imgsrc.indexOf('://') < 0) imgsrc = ROOT_PATH + '/' + imgsrc;
            document.querySelector('.showpic_img').src = imgsrc;
        });
        el.addEventListener('mouseleave', function() {
            document.querySelector('.showpic').style.display = 'none';
        });
    });

    // 测试缓存
    function testCache() {
        var form = document.getElementById('editForm');
        var type = form.querySelector('input[name="app[cache_type]"]:checked').value;
        var host = form.querySelector('input[name="app[cache_host]"]').value;
        var port = form.querySelector('input[name="app[cache_port]"]').value;
        var username = form.querySelector('input[name="app[cache_username]"]').value;
        var password = form.querySelector('input[name="app[cache_password]"]').value;
        var db = form.querySelector('input[name="app[cache_db]"]').value;

        layui.layer.msg('测试中...', {time: 500000});
        API.post('/admin/system/test-cache', {
            type: type, host: host, port: port,
            username: username, password: password, db: db
        }).then(function(r) {
            layui.layer.closeAll();
            layui.layer.msg(r.msg || '测试完成', {time: 1800});
        }).catch(function() {
            layui.layer.closeAll();
            layui.layer.msg('测试失败', {time: 1800});
        });
    }

    // 表单提交
    bindForm('editForm', '/admin/system/settings/save');
</script>
</body>
</html>
