<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>URL推送</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-16">推送配置</p></blockquote>
    <form class="layui-form layui-form-pane" id="configForm" style="padding:10px;">
        <div class="layui-form-item">
            <label class="layui-form-label">推送接口</label>
            <div class="layui-input-block"><input type="text" class="layui-input" name="push_url" placeholder="百度/搜狗/必应等推送接口URL"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">推送Token</label>
            <div class="layui-input-block"><input type="text" class="layui-input" name="push_token" placeholder="推送接口Token"></div>
        </div>
        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="saveConfig">保存配置</button>
            </div>
        </div>
    </form>

    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-16">推送操作</p></blockquote>
    <div style="padding:10px;">
        <button type="button" class="layui-btn" onclick="doPush()"><i class="layui-icon">&#xe654;</i>推送URL</button>
        <button type="button" class="layui-btn layui-btn-warm" onclick="doPushAll()"><i class="layui-icon">&#xe65c;</i>全量推送</button>
        <button type="button" class="layui-btn layui-btn-normal" onclick="doSitemap()"><i class="layui-icon">&#xe62c;</i>生成Sitemap</button>
    </div>

    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-16">推送日志</p></blockquote>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="40">ID</th>
                <th>推送URL</th>
                <th width="100">状态</th>
                <th width="80">结果</th>
                <th width="150">时间</th>
            </tr></thead>
            <tbody id="logBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var currentPage=1,pageLimit=20;

    // 加载配置
    function loadConfig(){
        API.get('/admin/urlsend/config').then(function(r){
            if(r.code===1&&r.data){
                var info=r.data;
                var f=document.getElementById('configForm');
                Object.keys(info).forEach(function(k){
                    var el=f.querySelector('[name="'+k+'"]');
                    if(el)el.value=info[k]||'';
                });
            }
        });
    }

    // 保存配置
    bindForm('configForm','/admin/urlsend/config');

    // 推送URL
    function doPush(){
        layui.use('layer',function(){
            layui.layer.confirm('确定推送URL？',function(i){
                API.post('/admin/urlsend/push').then(function(r){
                    layui.layer.msg(r.msg||'推送完成',{time:2000});
                    if(r.code===1)loadLogs(1);
                });
                layui.layer.close(i);
            });
        });
    }

    // 全量推送
    function doPushAll(){
        layui.use('layer',function(){
            layui.layer.confirm('确定全量推送？这可能需要较长时间。',function(i){
                API.post('/admin/urlsend/pushall').then(function(r){
                    layui.layer.msg(r.msg||'全量推送完成',{time:2000});
                    if(r.code===1)loadLogs(1);
                });
                layui.layer.close(i);
            });
        });
    }

    // 生成Sitemap
    function doSitemap(){
        layui.use('layer',function(){
            layui.layer.confirm('确定生成Sitemap？',function(i){
                API.post('/admin/urlsend/sitemap').then(function(r){
                    layui.layer.msg(r.msg||'Sitemap生成完成',{time:2000});
                });
                layui.layer.close(i);
            });
        });
    }

    // 加载日志
    function loadLogs(page){
        currentPage=page||1;
        API.get('/admin/urlsend/logs?page='+currentPage+'&limit='+pageLimit).then(function(r){
            if(r.code===1){
                renderLogs(r.data.list||r.data||[]);
                renderPag(r.data.total||0);
            }
        });
    }

    function renderLogs(list){
        var h='';
        list.forEach(function(vo){
            h+='<tr>';
            h+='<td>'+(vo.log_id||vo.id||'')+'</td>';
            h+='<td>'+htmlspecialchars(vo.url||vo.push_url||'')+'</td>';
            h+='<td>'+(vo.status==1?'<span class="layui-badge layui-bg-green">成功</span>':'<span class="layui-badge">失败</span>')+'</td>';
            h+='<td>'+htmlspecialchars(vo.result||vo.msg||'')+'</td>';
            h+='<td>'+mac_day(vo.time||vo.log_time,'color')+'</td>';
            h+='</tr>';
        });
        document.getElementById('logBody').innerHTML=h;
    }

    function renderPag(total){
        layui.use(['laypage'],function(){
            layui.laypage.render({
                elem:'pages',count:total,limit:pageLimit,curr:currentPage,
                layout:['count','prev','page','next','limit','skip'],
                jump:function(o,f){if(!f)loadLogs(o.curr);}
            });
        });
    }

    loadConfig();
    loadLogs(1);
    initTable({total:0,limit:pageLimit,page:1,onPageChange:function(p,l){pageLimit=l;loadLogs(p);}});
</script>
</body>
</html>
