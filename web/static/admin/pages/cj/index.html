<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>自定义采集</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline"><input type="text" autocomplete="off" placeholder="规则名称" class="layui-input" name="wd"></div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="showAddEdit()"><i class="layui-icon">&#xe654;</i>添加规则</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="40">ID</th>
                <th>规则名称</th>
                <th>采集URL</th>
                <th width="80">类型</th>
                <th width="80">状态</th>
                <th width="150">更新时间</th>
                <th width="200">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>

<!-- 添加/编辑弹窗 -->
<div id="editBox" style="display:none;padding:20px;">
    <form class="layui-form" id="editForm">
        <input type="hidden" name="rule_id" value="">
        <div class="layui-form-item">
            <label class="layui-form-label">规则名称</label>
            <div class="layui-input-block"><input type="text" class="layui-input" name="rule_name" placeholder="规则名称"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">采集URL</label>
            <div class="layui-input-block"><input type="text" class="layui-input" name="rule_url" placeholder="采集目标URL"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">采集类型</label>
            <div class="layui-input-inline">
                <select name="rule_type">
                    <option value="1">列表页</option>
                    <option value="2">详情页</option>
                    <option value="3">自定义</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline">
                <select name="rule_status">
                    <option value="1">启用</option>
                    <option value="0">禁用</option>
                </select>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script type="text/javascript">
    var currentPage=1,pageLimit=20;

    function loadData(page){
        currentPage=page||1;
        var fd={};
        new FormData(document.getElementById('searchForm')).forEach(function(v,k){if(v)fd[k]=v;});
        fd.page=currentPage;fd.limit=pageLimit;
        var qs=Object.keys(fd).map(function(k){return k+'='+encodeURIComponent(fd[k]);}).join('&');
        API.get('/admin/cj/list?'+qs).then(function(r){
            if(r.code===1){
                renderTable(r.data.list||r.data||[]);
                renderPag(r.data.total||0);
            }
        });
    }

    function renderTable(list){
        var h='';
        var types={'1':'列表页','2':'详情页','3':'自定义'};
        list.forEach(function(vo){
            var typeName=types[vo.rule_type]||vo.rule_type;
            var statusStr=vo.rule_status==1?'<span class="layui-badge layui-bg-green">启用</span>':'<span class="layui-badge">禁用</span>';
            h+='<tr>';
            h+='<td>'+vo.rule_id+'</td>';
            h+='<td>'+htmlspecialchars(vo.rule_name||'')+'</td>';
            h+='<td>'+htmlspecialchars(vo.rule_url||'')+'</td>';
            h+='<td>'+typeName+'</td>';
            h+='<td>'+statusStr+'</td>';
            h+='<td>'+mac_day(vo.rule_time,'color')+'</td>';
            h+='<td>';
            h+='<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-primary" onclick="showAddEdit('+vo.rule_id+')">编辑</a> ';
            h+='<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-warm" onclick="doRun('+vo.rule_id+')">采集</a> ';
            h+='<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-danger" onclick="delItem('+vo.rule_id+')">删除</a>';
            h+='</td></tr>';
        });
        document.getElementById('tableBody').innerHTML=h;
        layui.use('form',function(){layui.form.render();});
    }

    function renderPag(total){
        layui.use(['laypage'],function(){
            layui.laypage.render({
                elem:'pages',count:total,limit:pageLimit,curr:currentPage,
                layout:['count','prev','page','next','limit','skip'],
                jump:function(o,f){if(!f)loadData(o.curr);}
            });
        });
    }

    function doSearch(){loadData(1);}

    function showAddEdit(id){
        var f=document.getElementById('editForm');
        f.reset();
        f.querySelector('[name=rule_id]').value='';
        layui.use('form',function(){layui.form.render();});

        function openLayer(){
            layui.layer.open({
                type:1,title:(id?'编辑':'添加')+'采集规则',area:['500px','380px'],
                content:document.getElementById('editBox'),
                btn:['保存','取消'],
                yes:function(index){
                    var data={
                        rule_id:f.querySelector('[name=rule_id]').value,
                        rule_name:f.querySelector('[name=rule_name]').value,
                        rule_url:f.querySelector('[name=rule_url]').value,
                        rule_type:f.querySelector('[name=rule_type]').value,
                        rule_status:f.querySelector('[name=rule_status]').value
                    };
                    API.post('/admin/cj/save',data).then(function(r){
                        layui.layer.msg(r.msg||'保存完成',{time:1500});
                        if(r.code===1){layui.layer.close(index);loadData(currentPage);}
                    });
                }
            });
        }

        if(id){
            API.get('/admin/cj/detail/'+id).then(function(r){
                if(r.code===1&&r.data){
                    var info=r.data;
                    Object.keys(info).forEach(function(k){
                        var el=f.querySelector('[name="'+k+'"]');
                        if(el)el.value=info[k]||'';
                    });
                    layui.use('form',function(){layui.form.render();});
                }
                openLayer();
            });
        }else{
            openLayer();
        }
    }

    function doRun(id){
        layui.use('layer',function(){
            layui.layer.confirm('确定执行采集？',function(i){
                API.post('/admin/cj/run',{rule_id:id}).then(function(r){
                    layui.layer.msg(r.msg||'采集完成',{time:2000});
                });
                layui.layer.close(i);
            });
        });
    }

    function delItem(id){
        layui.use('layer',function(){
            layui.layer.confirm('确定删除该规则？',function(i){
                API.post('/admin/cj/delete',{ids:id.toString()}).then(function(r){
                    layui.layer.msg(r.msg||'操作完成',{time:1500});
                    if(r.code===1)loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    loadData(1);
    initTable({total:0,limit:pageLimit,page:1,onPageChange:function(p,l){pageLimit=l;loadData(p);}});
</script>
</body>
</html>
