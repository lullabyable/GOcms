<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>IP黑名单</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-16">IP黑名单管理</p></blockquote>
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline"><input type="text" autocomplete="off" placeholder="IP地址" class="layui-input" name="wd"></div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="showAdd()"><i class="layui-icon">&#xe654;</i>添加IP</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>批量删除</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="150">IP地址</th>
                <th>封禁原因</th>
                <th width="180">添加时间</th>
                <th width="120">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>

<!-- 添加IP弹窗 -->
<div id="addBox" style="display:none;padding:20px;">
    <form class="layui-form" id="addForm">
        <div class="layui-form-item">
            <label class="layui-form-label">IP地址</label>
            <div class="layui-input-block"><input type="text" class="layui-input" name="ip" placeholder="如: 192.168.1.1"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">封禁原因</label>
            <div class="layui-input-block"><input type="text" class="layui-input" name="reason" placeholder="封禁原因（可选）"></div>
        </div>
    </form>
</div>

<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script type="text/javascript">
    var currentPage=1,pageLimit=20;

    function loadData(page){
        currentPage=page||1;
        var fd={};
        new FormData(document.getElementById('searchForm')).forEach(function(v,k){if(v)fd[k]=v;});
        fd.page=currentPage;fd.limit=pageLimit;
        var qs=Object.keys(fd).map(function(k){return k+'='+encodeURIComponent(fd[k]);}).join('&');
        API.get('/admin/safety/ipblacklist?'+qs).then(function(r){
            if(r.code===1){
                renderTable(r.data.list||r.data||[]);
                renderPag(r.data.total||0);
            }
        });
    }

    function renderTable(list){
        var h='';
        list.forEach(function(vo){
            h+='<tr>';
            h+='<td><input type="checkbox" name="ids[]" value="'+htmlspecialchars(vo.ip)+'" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h+='<td>'+htmlspecialchars(vo.ip||'')+'</td>';
            h+='<td>'+htmlspecialchars(vo.reason||'-')+'</td>';
            h+='<td>'+mac_day(vo.created_at,'color')+'</td>';
            h+='<td><a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-danger" onclick="delItem(\''+htmlspecialchars(vo.ip).replace(/'/g,"\\'")+'\')">删除</a></td>';
            h+='</tr>';
        });
        document.getElementById('tableBody').innerHTML=h;
        layui.use('form',function(){layui.form.render('checkbox');});
    }

    function renderPag(total){
        layui.use(['laypage'],function(){
            layui.laypage.render({
                elem:'pages',count:total,limit:pageLimit,curr:currentPage,
                layout:['count','prev','page','next','limit','skip'],
                jump:function(o,f){if(!f)loadData(o.curr);}
            });
        });
    }

    function doSearch(){loadData(1);}

    function showAdd(){
        var f=document.getElementById('addForm');
        f.reset();
        layui.use('layer',function(){
            layui.layer.open({
                type:1,title:'添加IP黑名单',area:['450px','250px'],
                content:document.getElementById('addBox'),
                btn:['添加','取消'],
                yes:function(index){
                    var ip=f.querySelector('[name=ip]').value.trim();
                    var reason=f.querySelector('[name=reason]').value.trim();
                    if(!ip){layui.layer.msg('请输入IP地址');return;}
                    API.post('/admin/safety/ipblacklist/add',{ip:ip,reason:reason}).then(function(r){
                        layui.layer.msg(r.msg||'添加成功',{time:1500});
                        if(r.code===1){layui.layer.close(index);loadData(currentPage);}
                    });
                }
            });
        });
    }

    function delItem(ip){
        layui.use('layer',function(){
            layui.layer.confirm('确定解除对 '+ip+' 的封禁？',function(i){
                API.post('/admin/safety/ipblacklist/delete',{ip:ip}).then(function(r){
                    layui.layer.msg(r.msg||'操作完成',{time:1500});
                    if(r.code===1)loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    function batchDel(){
        var ips=[];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e){ips.push(e.value);});
        if(!ips.length){layui.use('layer',function(){layui.layer.msg('请先选择');});return;}
        layui.use('layer',function(){
            layui.layer.confirm('确定解除选中的 '+ips.length+' 个IP封禁？',function(i){
                API.post('/admin/safety/ipblacklist/delete',{ip:ips.join(',')}).then(function(r){
                    layui.layer.msg(r.msg||'操作完成',{time:1500});
                    if(r.code===1)loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    loadData(1);
    initTable({total:0,limit:pageLimit,page:1,onPageChange:function(p,l){pageLimit=l;loadData(p);}});
</script>
</body>
</html>
