<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>用户组编辑</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-16">编辑用户组</p></blockquote>
    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="group_id" id="group_id" value="">
        <div class="layui-form-item">
            <label class="layui-form-label">组名称</label>
            <div class="layui-input-inline w300"><input type="text" class="layui-input" name="group_name" placeholder="用户组名称"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">类型</label>
            <div class="layui-input-inline">
                <select name="group_type">
                    <option value="1">普通用户</option>
                    <option value="2">VIP用户</option>
                    <option value="3">管理员</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">积分</label>
            <div class="layui-input-inline w300"><input type="number" class="layui-input" name="group_points" value="0" placeholder="用户组积分"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline">
                <select name="group_status">
                    <option value="1">开启</option>
                    <option value="0">关闭</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script>
var itemId=getQueryParam('id');
function loadDetail(){
    if(!itemId)return;
    API.get('/admin/group/detail/'+itemId).then(function(r){
        if(r.code===1&&r.data){
            var info=r.data;
            var f=document.getElementById('editForm');
            Object.keys(info).forEach(function(k){
                var el=f.querySelector('[name="'+k+'"]');
                if(el){
                    if(el.type==='checkbox')el.checked=!!info[k];
                    else el.value=info[k]||'';
                }
            });
            layui.use('form',function(){layui.form.render();});
        }
    });
}
loadDetail();
bindForm('editForm','/admin/group/save',function(r){
    if(!itemId&&r.data&&r.data.group_id){
        itemId=r.data.group_id;
        document.getElementById('group_id').value=itemId;
    }
});
</script>
</body>
</html>
