<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>用户组管理</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="window.location.href='info.html'"><i class="layui-icon">&#xe654;</i>添加</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>删除</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="40">ID</th>
                <th>组名称</th>
                <th width="80">类型</th>
                <th width="80">积分</th>
                <th width="80">状态</th>
                <th width="200">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var currentPage=1,pageLimit=20;

    function loadData(page){
        currentPage=page||1;
        var fd={page:currentPage,limit:pageLimit};
        var qs=Object.keys(fd).map(function(k){return k+'='+fd[k];}).join('&');
        API.get('/admin/group/list?'+qs).then(function(r){
            if(r.code===1){
                renderTable(r.data.list||r.data||[]);
                renderPag(r.data.total||0);
            }
        });
    }

    function renderTable(list){
        var h='';
        var types={'1':'普通用户','2':'VIP用户','3':'管理员'};
        list.forEach(function(vo){
            var typeName=types[vo.group_type]||vo.group_type||'普通';
            var statusStr=vo.group_status==1?'<span class="layui-badge layui-bg-green">开启</span>':'<span class="layui-badge">关闭</span>';
            h+='<tr>';
            h+='<td><input type="checkbox" name="ids[]" value="'+vo.group_id+'" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h+='<td>'+vo.group_id+'</td>';
            h+='<td>'+htmlspecialchars(vo.group_name||'')+'</td>';
            h+='<td>'+typeName+'</td>';
            h+='<td>'+(vo.group_points||0)+'</td>';
            h+='<td>'+statusStr+'</td>';
            h+='<td>';
            h+='<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-primary" onclick="window.location.href=\'info.html?id='+vo.group_id+'\'">编辑</a> ';
            h+='<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-danger" onclick="delItem('+vo.group_id+')">删除</a>';
            h+='</td></tr>';
        });
        document.getElementById('tableBody').innerHTML=h;
        layui.use('form',function(){layui.form.render('checkbox');});
    }

    function renderPag(total){
        layui.use(['laypage'],function(){
            layui.laypage.render({
                elem:'pages',count:total,limit:pageLimit,curr:currentPage,
                layout:['count','prev','page','next','limit','skip'],
                jump:function(o,f){if(!f)loadData(o.curr);}
            });
        });
    }

    function delItem(id){
        layui.use('layer',function(){
            layui.layer.confirm('确定删除？',function(i){
                API.post('/admin/group/delete/'+id,{}).then(function(r){
                    layui.layer.msg(r.msg||'操作完成',{time:1500});
                    if(r.code===1)loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    function batchDel(){
        var ids=[];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e){ids.push(e.value);});
        if(!ids.length){layui.use('layer',function(){layui.layer.msg('请先选择');});return;}
        layui.use('layer',function(){
            layui.layer.confirm('确定删除 '+ids.length+' 条？',function(i){
                API.post('/admin/group/delete/'+ids.join(','),{}).then(function(r){
                    layui.layer.msg(r.msg||'操作完成',{time:1500});
                    if(r.code===1)loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    loadData(1);
    initTable({total:0,limit:pageLimit,page:1,onPageChange:function(p,l){pageLimit=l;loadData(p);}});
</script>
</body>
</html>
