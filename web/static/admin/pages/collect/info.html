<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>资源站编辑</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="id" id="source_id" value="">

        <div class="layui-form-item">
            <label class="layui-form-label">资源站名称：</label>
            <div class="layui-input-inline w400">
                <input type="text" class="layui-input" value="" name="name" placeholder="请输入资源站名称">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">API地址：</label>
            <div class="layui-input-inline w500">
                <input type="text" class="layui-input" value="" name="api_url" placeholder="请输入API接口地址">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">更新规则：</label>
            <div class="layui-input-inline w200">
                <select name="up_rule">
                    <option value="a">全部更新</option>
                    <option value="h">仅更新当天</option>
                    <option value="i">增量更新</option>
                </select>
            </div>
            <div class="layui-form-mid layui-word-aux">a=全部, h=当天, i=增量</div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">优先级：</label>
            <div class="layui-input-inline w150">
                <input type="number" class="layui-input" value="0" name="priority" placeholder="数字越小优先级越高">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">状态：</label>
            <div class="layui-input-inline">
                <select name="status">
                    <option value="1">启用</option>
                    <option value="0">禁用</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script type="text/javascript">
    var itemId = getQueryParam('id');

    function loadDetail() {
        if (!itemId) return;
        API.get('/admin/collect/source/detail/' + itemId).then(function(r) {
            if (r.code === 1 && r.data) {
                var info = r.data;
                var form = document.getElementById('editForm');
                Object.keys(info).forEach(function(k) {
                    var el = form.querySelector('[name="' + k + '"]');
                    if (el) {
                        if (el.type === 'checkbox') el.checked = !!info[k];
                        else if (el.type === 'radio') {
                            form.querySelectorAll('[name="' + k + '"]').forEach(function(rd) {
                                rd.checked = (rd.value == info[k]);
                            });
                        } else el.value = info[k] || '';
                    }
                });
                layui.use('form', function() { layui.form.render(); });
            }
        });
    }

    loadDetail();

    // 使用 API.form 提交 (handler 用 c.FormValue 读取)
    layui.use(['form', 'layer'], function() {
        var form = layui.form, layer = layui.layer;
        form.on('submit(formSubmit)', function(data) {
            layer.msg('正在提交...', {time: 500000});
            var fd = new FormData();
            Object.keys(data.field).forEach(function(k) {
                fd.append(k, data.field[k]);
            });
            API.form('/admin/collect/source/save', fd).then(function(r) {
                layer.closeAll();
                if (r.code === 1) {
                    layer.msg(r.msg || '保存成功', {time: 1500});
                    if (!itemId && r.data && r.data.id) {
                        itemId = r.data.id;
                        document.getElementById('source_id').value = itemId;
                        window.history.replaceState({}, '', 'info.html?id=' + itemId);
                    }
                } else {
                    layer.msg(r.msg || '保存失败', {time: 2000});
                }
            }).catch(function() {
                layer.closeAll();
                layer.msg('请求失败', {time: 2000});
            });
            return false;
        });
    });
</script>
</body>
</html>
