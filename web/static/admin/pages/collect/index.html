<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>资源站采集</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline">
                    <input type="text" autocomplete="off" placeholder="关键词" class="layui-input" name="wd">
                </div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="window.location.href='info.html'"><i class="layui-icon">&#xe654;</i>添加资源站</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>删除</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="50">ID</th>
                <th>资源站名称</th>
                <th>API地址</th>
                <th width="80">更新规则</th>
                <th width="70">优先级</th>
                <th width="80">状态</th>
                <th width="150">最后同步</th>
                <th width="280">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var currentPage = 1, pageLimit = 20;

    function loadData(page) {
        currentPage = page || 1;
        var fd = {};
        new FormData(document.getElementById('searchForm')).forEach(function(v, k) { if (v) fd[k] = v; });
        fd.page = currentPage;
        fd.limit = pageLimit;
        var qs = Object.keys(fd).map(function(k) { return k + '=' + encodeURIComponent(fd[k]); }).join('&');
        API.get('/admin/collect/source/list?' + qs).then(function(r) {
            if (r.code === 1) {
                renderTable(r.data.list || []);
                renderPag(r.data.total || 0);
            }
        });
    }

    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr>';
            h += '<td><input type="checkbox" name="ids[]" value="' + vo.id + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td>' + vo.id + '</td>';
            h += '<td>' + htmlspecialchars(vo.name || '') + '</td>';
            h += '<td><span style="font-size:12px;color:#666;">' + htmlspecialchars(vo.api_url || '') + '</span></td>';
            h += '<td>' + (vo.up_rule || '-') + '</td>';
            h += '<td>' + (vo.priority || 0) + '</td>';
            h += '<td>' + (vo.status == 1
                ? '<span class="layui-badge layui-bg-green">启用</span>'
                : '<span class="layui-badge">禁用</span>') + '</td>';
            h += '<td>' + (vo.last_sync ? mac_day(vo.last_sync, 'color') : '-') + '</td>';
            h += '<td class="mac-table-opt-cell"><div class="mac-table-opt-btns">';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-warm" onclick="testSource(' + vo.id + ')">测试</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-normal" onclick="startCollect(' + vo.id + ')">采集</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-primary" onclick="window.location.href=\'info.html?id=' + vo.id + '\'">编辑</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-danger" onclick="delItem(' + vo.id + ')">删除</a>';
            h += '</div></td></tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    function renderPag(total) {
        layui.use(['laypage'], function() {
            layui.laypage.render({
                elem: 'pages', count: total, limit: pageLimit, curr: currentPage,
                layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                jump: function(o, f) { if (!f) loadData(o.curr); }
            });
        });
    }

    function doSearch() { loadData(1); }

    function testSource(id) {
        layui.use('layer', function() {
            layui.layer.msg('正在测试连接...', {time: 30000});
            // 通过API地址测试
            API.get('/admin/collect/source/detail/' + id).then(function(r) {
                if (r.code === 1 && r.data && r.data.api_url) {
                    var fd = new FormData();
                    fd.append('api_url', r.data.api_url);
                    API.form('/admin/collect/test', fd).then(function(res) {
                        layui.layer.closeAll();
                        layui.layer.msg(res.msg || (res.code === 1 ? '连接成功' : '连接失败'), {time: 2000});
                    });
                } else {
                    layui.layer.closeAll();
                    layui.layer.msg('获取资源站信息失败', {time: 2000});
                }
            });
        });
    }

    function startCollect(id) {
        layui.use('layer', function() {
            layui.layer.confirm('确定要开始采集此资源站吗？', function(i) {
                layui.layer.close(i);
                layui.layer.msg('正在采集...', {time: 60000});
                API.get('/admin/collect/source/detail/' + id).then(function(r) {
                    if (r.code === 1 && r.data && r.data.api_url) {
                        var fd = new FormData();
                        fd.append('api_url', r.data.api_url);
                        API.form('/admin/collect/start', fd).then(function(res) {
                            layui.layer.closeAll();
                            layui.layer.msg(res.msg || (res.code === 1 ? '采集完成' : '采集失败'), {time: 3000});
                        });
                    } else {
                        layui.layer.closeAll();
                        layui.layer.msg('获取资源站信息失败', {time: 2000});
                    }
                });
            });
        });
    }

    function delItem(id) {
        layui.use('layer', function() {
            layui.layer.confirm('确定要删除此资源站吗？', function(i) {
                API.post('/admin/collect/source/delete', { ids: id.toString() }).then(function(r) {
                    layui.layer.msg(r.msg || '操作成功', {time: 1500});
                    if (r.code === 1) loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    function batchDel() {
        var ids = [];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e) { ids.push(e.value); });
        if (!ids.length) {
            layui.use('layer', function() { layui.layer.msg('请先选择数据'); });
            return;
        }
        layui.use('layer', function() {
            layui.layer.confirm('确定要删除选中的 ' + ids.length + ' 条数据吗？', function(i) {
                API.post('/admin/collect/source/delete', { ids: ids.join(',') }).then(function(r) {
                    layui.layer.msg(r.msg || '操作成功', {time: 1500});
                    if (r.code === 1) loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    loadData(1);
    initTable({ total: 0, limit: pageLimit, page: 1, onPageChange: function(p, l) { pageLimit = l; loadData(p); } });
</script>
</body>
</html>
