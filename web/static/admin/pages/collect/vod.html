<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>采集视频列表</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="mb10">
            <div class="layui-input-inline w150 m5">
                <a href="javascript:;" class="select_source red" data-id="">全部资源站</a>
            </div>
            <div id="sourceList" class="layui-input-inline"></div>
        </div>
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline">
                    <input type="text" autocomplete="off" placeholder="关键词" class="layui-input" name="wd">
                </div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
    </div>

    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th>名称</th>
                <th width="100">分类</th>
                <th width="100">来源</th>
                <th width="150">更新时间</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div class="layui-btn-group" style="margin-top:10px;">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="collectSelected()"><i class="layui-icon">&#xe654;</i>采集选中</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="collectToday()"><i class="layui-icon">&#xe654;</i>采集今日</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="collectAll()"><i class="layui-icon">&#xe654;</i>采集全部</a>
        </div>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script type="text/javascript">
    var currentPage = 1, pageLimit = 20;
    var currentSourceId = '';

    // 加载资源站列表
    function loadSources() {
        API.get('/admin/collect/source/list').then(function(r) {
            if (r.code === 1 && r.data) {
                var list = r.data.list || r.data || [];
                var html = '';
                list.forEach(function(vo) {
                    html += '<div class="layui-input-inline w150 m5">';
                    html += '<a href="javascript:;" class="select_source" data-id="' + vo.id + '">' + htmlspecialchars(vo.name || '') + '</a>';
                    html += '</div>';
                });
                document.getElementById('sourceList').innerHTML = html;

                // 绑定点击事件
                document.querySelectorAll('.select_source').forEach(function(el) {
                    el.addEventListener('click', function() {
                        document.querySelectorAll('.select_source').forEach(function(a) { a.classList.remove('red'); });
                        this.classList.add('red');
                        currentSourceId = this.getAttribute('data-id');
                        loadData(1);
                    });
                });
            }
        });
    }

    function loadData(page) {
        currentPage = page || 1;
        var fd = {};
        new FormData(document.getElementById('searchForm')).forEach(function(v, k) { if (v) fd[k] = v; });
        if (currentSourceId) fd.source_id = currentSourceId;
        fd.page = currentPage;
        fd.limit = pageLimit;
        var qs = Object.keys(fd).map(function(k) { return k + '=' + encodeURIComponent(fd[k]); }).join('&');
        API.get('/admin/collect/vod/list?' + qs).then(function(r) {
            if (r.code === 1 && r.data) {
                renderTable(r.data.list || []);
                renderPag(r.data.total || 0);
            }
        }).catch(function() {
            // 回退到通用接口
            API.get('/admin/collect/source/list?' + qs).then(function(r) {
                if (r.code === 1 && r.data) {
                    renderTable(r.data.list || []);
                    renderPag(r.data.total || 0);
                }
            });
        });
    }

    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr>';
            h += '<td><input type="checkbox" name="ids[]" value="' + (vo.vod_id || vo.id) + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td>' + htmlspecialchars(vo.vod_name || vo.name || '') + '</td>';
            h += '<td>' + htmlspecialchars(vo.type_name || (vo.type ? vo.type.type_name : '') || '') + '</td>';
            h += '<td>' + htmlspecialchars(vo.vod_play_from || vo.from || '-') + '</td>';
            h += '<td>' + mac_day(vo.vod_time || vo.time, 'color') + '</td>';
            h += '</tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    function renderPag(total) {
        layui.use(['laypage'], function() {
            layui.laypage.render({
                elem: 'pages', count: total, limit: pageLimit, curr: currentPage,
                layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                jump: function(o, f) { if (!f) loadData(o.curr); }
            });
        });
    }

    function doSearch() { loadData(1); }

    function collectSelected() {
        var ids = [];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e) { ids.push(e.value); });
        if (!ids.length) {
            layui.use('layer', function() { layui.layer.msg('请先选择要采集的视频'); });
            return;
        }
        doCollect({ ids: ids.join(','), ac: 'cjsel' });
    }

    function collectToday() {
        doCollect({ ac: 'cjday', h: 24 });
    }

    function collectAll() {
        layui.use('layer', function() {
            layui.layer.confirm('确定要采集全部数据吗？这可能需要较长时间。', function(i) {
                layui.layer.close(i);
                doCollect({ ac: 'cjall' });
            });
        });
    }

    function doCollect(params) {
        if (currentSourceId) params.source_id = currentSourceId;
        layui.use('layer', function() {
            layui.layer.msg('正在采集...', {time: 120000});
            API.post('/admin/collect/start', params).then(function(r) {
                layui.layer.closeAll();
                layui.layer.msg(r.msg || (r.code === 1 ? '采集完成' : '采集失败'), {time: 3000});
                if (r.code === 1) loadData(currentPage);
            }).catch(function() {
                layui.layer.closeAll();
                layui.layer.msg('采集请求失败', {time: 2000});
            });
        });
    }

    loadSources();
    loadData(1);
    initTable({ total: 0, limit: pageLimit, page: 1, onPageChange: function(p, l) { pageLimit = l; loadData(p); } });
</script>
</body>
</html>
