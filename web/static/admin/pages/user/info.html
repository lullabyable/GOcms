<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>用户管理</title><link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/admin_style.css"></head><body>
<div class="page-container p10"><form class="layui-form layui-form-pane" id="editForm"><input type="hidden" name="user_id" id="user_id" value="">
<div class="layui-form-item"><label class="layui-form-label">用户名：</label><div class="layui-input-inline w300"><input type="text" class="layui-input" value="" name="user_name"></div></div>
<div class="layui-form-item"><label class="layui-form-label">密码：</label><div class="layui-input-inline w300"><input type="password" class="layui-input" value="" placeholder="不修改请留空" name="user_pwd"></div></div>
<div class="layui-form-item"><label class="layui-form-label">邮箱：</label><div class="layui-input-inline w300"><input type="text" class="layui-input" value="" name="user_email"></div></div>
<div class="layui-form-item"><label class="layui-form-label">手机：</label><div class="layui-input-inline w300"><input type="text" class="layui-input" value="" name="user_phone"></div></div>
<div class="layui-form-item"><label class="layui-form-label">状态：</label><div class="layui-input-inline"><select name="user_status"><option value="1">开启</option><option value="0">关闭</option></select></div></div>
<div class="layui-form-item"><label class="layui-form-label">积分：</label><div class="layui-input-inline"><input type="text" class="layui-input" value="" name="user_points"></div></div>
<div class="layui-form-item center"><div class="layui-input-block"><button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button><button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button></div></div>
</form></div>
<script type="text/javascript" src="../../layui/layui.js"></script><script type="text/javascript" src="../../js/app.js"></script><script>
var itemId=getQueryParam('id');function loadDetail(){if(!itemId)return;API.get('/admin/api/user/detail?id='+itemId).then(function(r){if(r.code===1&&r.data){var info=r.data,f=document.getElementById('editForm');Object.keys(info).forEach(function(k){var el=f.querySelector('[name="'+k+'"]');if(el){if(el.type==='checkbox')el.checked=!!info[k];else if(el.type==='radio')f.querySelectorAll('[name="'+k+'"]').forEach(function(rd){rd.checked=(rd.value==info[k]);});else el.value=info[k]||'';}});layui.use('form',function(){layui.form.render();});}});}loadDetail();bindForm('editForm','/admin/api/user/save',function(r){if(!itemId&&r.data&&r.data.user_id){itemId=r.data.user_id;document.getElementById('user_id').value=itemId;}});
</script></body></html>
