<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>用户编辑</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="user_id" id="user_id" value="">

        <div class="layui-form-item">
            <label class="layui-form-label">用户名：</label>
            <div class="layui-input-inline w300">
                <input type="text" class="layui-input" value="" name="user_name" placeholder="请输入用户名">
            </div>
            <label class="layui-form-label">昵称：</label>
            <div class="layui-input-inline w300">
                <input type="text" class="layui-input" value="" name="user_nick_name" placeholder="用户昵称">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">密码：</label>
            <div class="layui-input-inline w300">
                <input type="password" class="layui-input" value="" name="user_pwd" placeholder="不修改请留空">
            </div>
            <label class="layui-form-label">用户组：</label>
            <div class="layui-input-inline">
                <select name="group_id" id="group_id">
                    <option value="">请选择用户组</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">邮箱：</label>
            <div class="layui-input-inline w300">
                <input type="text" class="layui-input" value="" name="user_email" placeholder="电子邮箱">
            </div>
            <label class="layui-form-label">手机：</label>
            <div class="layui-input-inline w300">
                <input type="text" class="layui-input" value="" name="user_phone" placeholder="手机号码">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">状态：</label>
            <div class="layui-input-inline">
                <select name="user_status">
                    <option value="1">正常</option>
                    <option value="0">禁用</option>
                </select>
            </div>
            <label class="layui-form-label">积分：</label>
            <div class="layui-input-inline w150">
                <input type="text" class="layui-input" value="0" name="user_points" placeholder="用户积分">
            </div>
            <label class="layui-form-label">每日积分：</label>
            <div class="layui-input-inline w150">
                <input type="text" class="layui-input" value="0" name="user_points_day" placeholder="每日积分">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">头像：</label>
            <div class="layui-input-inline w500">
                <input type="text" class="layui-input" value="" name="user_portrait" placeholder="头像URL地址">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">注册IP：</label>
            <div class="layui-input-inline w200">
                <input type="text" class="layui-input" value="" name="user_reg_ip" readonly>
            </div>
            <label class="layui-form-label">注册时间：</label>
            <div class="layui-input-inline w200">
                <input type="text" class="layui-input" value="" id="user_reg_time_display" readonly>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">最后登录IP：</label>
            <div class="layui-input-inline w200">
                <input type="text" class="layui-input" value="" id="user_login_ip_display" readonly>
            </div>
            <label class="layui-form-label">最后登录：</label>
            <div class="layui-input-inline w200">
                <input type="text" class="layui-input" value="" id="user_login_time_display" readonly>
            </div>
        </div>

        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                <button class="layui-btn layui-btn-warm" type="reset">重置</button>
                <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script>
    var itemId = getQueryParam('id');

    // 加载用户组列表
    function loadGroups() {
        API.get('/admin/group/list').then(function(r) {
            if (r.code === 1 && r.data) {
                var select = document.getElementById('group_id');
                select.innerHTML = '<option value="">请选择用户组</option>';
                r.data.forEach(function(g) {
                    select.innerHTML += '<option value="' + g.group_id + '">' + g.group_name + '</option>';
                });
                layui.use('form', function() { layui.form.render('select'); });
            }
        });
    }

    function loadDetail() {
        if (!itemId) return;
        API.get('/admin/user/detail/' + itemId).then(function(r) {
            if (r.code === 1 && r.data) {
                var info = r.data;
                var f = document.getElementById('editForm');
                Object.keys(info).forEach(function(k) {
                    var el = f.querySelector('[name="' + k + '"]');
                    if (el) {
                        if (el.type === 'checkbox') el.checked = !!info[k];
                        else if (el.type === 'radio') {
                            f.querySelectorAll('[name="' + k + '"]').forEach(function(rd) {
                                rd.checked = (rd.value == info[k]);
                            });
                        } else el.value = info[k] || '';
                    }
                });
                // 显示只读字段
                document.getElementById('user_reg_time_display').value = info.user_reg_time ? mac_day(info.user_reg_time, '') : '';
                document.getElementById('user_login_time_display').value = info.user_login_time ? mac_day(info.user_login_time, '') : (info.user_last_time ? mac_day(info.user_last_time, '') : '');
                document.getElementById('user_login_ip_display').value = long2ip(info.user_login_ip) || long2ip(info.user_last_ip) || '';
                layui.use('form', function() { layui.form.render(); });
            }
        });
    }

    loadGroups();
    setTimeout(function() { loadDetail(); }, 300);

    bindForm('editForm', '/admin/user/save', function(r) {
        if (!itemId && r.data && r.data.user_id) {
            itemId = r.data.user_id;
            document.getElementById('user_id').value = itemId;
            window.history.replaceState({}, '', 'info.html?id=' + itemId);
        }
    });
</script>
</body>
</html>
