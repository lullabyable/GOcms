<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>签到积分管理</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline w150">
                    <select name="status">
                        <option value="">全部状态</option>
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <div class="layui-input-inline">
                    <input type="text" autocomplete="off" placeholder="用户名/关键词" class="layui-input" name="keyword">
                </div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a class="layui-btn">一级推广人数【<span id="l1count">0</span>】 总佣金积分【<span id="l1points">0</span>】</a>
            <a class="layui-btn layui-btn-normal">二级推广人数【<span id="l2count">0</span>】 总佣金积分【<span id="l2points">0</span>】</a>
            <a class="layui-btn layui-btn-warm">三级推广人数【<span id="l3count">0</span>】 总佣金积分【<span id="l3points">0</span>】</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="50">ID</th>
                <th>用户名</th>
                <th width="100">用户组</th>
                <th width="80">状态</th>
                <th width="80">积分</th>
                <th width="80">推广级别</th>
                <th width="140">注册时间</th>
                <th width="140">最后登录</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script type="text/javascript">
    var currentPage = 1, pageLimit = 20;
    var groupMap = {};

    // 加载用户组
    function loadGroups() {
        API.get('/admin/group/list').then(function(r) {
            if (r.code === 1 && r.data) {
                r.data.forEach(function(g) { groupMap[g.group_id] = g.group_name; });
            }
        });
    }

    function loadData(page) {
        currentPage = page || 1;
        var fd = {};
        new FormData(document.getElementById('searchForm')).forEach(function(v, k) { if (v) fd[k] = v; });
        fd.page = currentPage;
        fd.page_size = pageLimit;
        var qs = Object.keys(fd).map(function(k) { return k + '=' + encodeURIComponent(fd[k]); }).join('&');
        API.get('/admin/user/list?' + qs).then(function(r) {
            if (r.code === 1 && r.data) {
                renderTable(r.data.list || []);
                renderPag(r.data.total || 0);
                // 更新统计
                if (r.data.stats) {
                    document.getElementById('l1count').textContent = r.data.stats.level_1_count || 0;
                    document.getElementById('l1points').textContent = r.data.stats.level_1_points || 0;
                    document.getElementById('l2count').textContent = r.data.stats.level_2_count || 0;
                    document.getElementById('l2points').textContent = r.data.stats.level_2_points || 0;
                    document.getElementById('l3count').textContent = r.data.stats.level_3_count || 0;
                    document.getElementById('l3points').textContent = r.data.stats.level_3_points || 0;
                }
            }
        });
    }

    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr>';
            h += '<td><input type="checkbox" name="ids[]" value="' + vo.user_id + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td>' + vo.user_id + '</td>';
            h += '<td>' + htmlspecialchars(vo.user_name || '') + '</td>';
            h += '<td>' + htmlspecialchars(groupMap[vo.group_id] || ('组' + vo.group_id)) + '</td>';
            h += '<td>' + (vo.user_status == 1 ? '<span class="layui-badge layui-bg-green">正常</span>' : '<span class="layui-badge">禁用</span>') + '</td>';
            h += '<td><span class="layui-badge layui-bg-orange">' + (vo.user_points || 0) + '</span></td>';
            // 推广级别判断
            var levelText = '-';
            if (vo.user_pid && vo.user_pid > 0) levelText = '一级';
            else if (vo.user_pid_2 && vo.user_pid_2 > 0) levelText = '二级';
            else if (vo.user_pid_3 && vo.user_pid_3 > 0) levelText = '三级';
            h += '<td>' + levelText + '</td>';
            h += '<td>' + mac_day(vo.user_reg_time, '') + '</td>';
            h += '<td>' + mac_day(vo.user_login_time || vo.user_last_time, 'color') + '</td>';
            h += '</tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    function renderPag(total) {
        layui.use(['laypage'], function() {
            layui.laypage.render({
                elem: 'pages', count: total, limit: pageLimit, curr: currentPage,
                layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                jump: function(o, f) { if (!f) loadData(o.curr); }
            });
        });
    }

    function doSearch() { loadData(1); }

    loadGroups();
    loadData(1);
    initTable({ total: 0, limit: pageLimit, page: 1, onPageChange: function(p, l) { pageLimit = l; loadData(p); } });
</script>
</body>
</html>
