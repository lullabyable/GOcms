<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>管理员列表</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline">
                    <input type="text" autocomplete="off" placeholder="关键词" class="layui-input" name="wd">
                </div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="window.location.href='info.html'"><i class="layui-icon">&#xe654;</i>添加</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>删除</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="40">ID</th>
                <th>名称</th>
                <th width="80">角色</th>
                <th width="60">状态</th>
                <th width="80">登录次数</th>
                <th width="150">最后登录时间</th>
                <th width="160">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var adminData = [];

    function getRoleName(role) {
        var map = { 1: '超级管理员', 2: '普通管理员', 3: '只读管理员' };
        return map[role] || ('角色' + role);
    }

    function loadAdmins() {
        API.get('/admin/admin/list').then(function(r) {
            if (r.code === 1 && r.data) {
                adminData = Array.isArray(r.data) ? r.data : (r.data.list || []);
                // 客户端过滤搜索
                var wd = document.querySelector('#searchForm [name="wd"]').value.trim().toLowerCase();
                var filtered = wd ? adminData.filter(function(a) {
                    return (a.admin_name || '').toLowerCase().indexOf(wd) > -1;
                }) : adminData;
                renderTable(filtered);
                renderPag(filtered.length);
            }
        });
    }

    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr>';
            h += '<td><input type="checkbox" name="ids[]" value="' + vo.admin_id + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td>' + vo.admin_id + '</td>';
            h += '<td>' + htmlspecialchars(vo.admin_name || '') + '</td>';
            h += '<td><span class="layui-badge layui-bg-blue">' + getRoleName(vo.admin_role) + '</span></td>';
            h += '<td>' + (vo.admin_status == 1 ? '<span class="layui-badge layui-bg-green">启用</span>' : '<span class="layui-badge">禁用</span>') + '</td>';
            h += '<td>' + (vo.admin_login_num || 0) + '</td>';
            h += '<td>' + mac_day(vo.admin_last_time, 'color') + '</td>';
            h += '<td>';
            h += '<a href="javascript:;" class="layui-btn layui-btn-primary layui-btn-xs" onclick="window.location.href=\'info.html?id=' + vo.admin_id + '\'">编辑</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-danger layui-btn-xs" onclick="delItem(' + vo.admin_id + ')">删除</a>';
            h += '</td></tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    function renderPag(total) {
        layui.use(['laypage'], function() {
            layui.laypage.render({
                elem: 'pages', count: total, limit: 1000, curr: 1,
                layout: ['count', 'prev', 'page', 'next', 'skip'],
                jump: function(o, f) {}
            });
        });
    }

    function doSearch() { loadAdmins(); }

    function delItem(id) {
        layui.use('layer', function() {
            layui.layer.confirm('确定删除？', function(i) {
                API.post('/admin/admin/delete/' + id, {}).then(function(r) {
                    layui.layer.msg(r.msg || '操作完成', { time: 1500 });
                    if (r.code === 1) loadAdmins();
                });
                layui.layer.close(i);
            });
        });
    }

    function batchDel() {
        var ids = [];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e) { ids.push(e.value); });
        if (!ids.length) {
            layui.use('layer', function() { layui.layer.msg('请先选择'); });
            return;
        }
        layui.use('layer', function() {
            layui.layer.confirm('确定删除' + ids.length + '条？', function(i) {
                ids.forEach(function(id) {
                    API.post('/admin/admin/delete/' + id, {}).then(function(r) {
                        layui.layer.msg(r.msg || '操作完成', { time: 1500 });
                    });
                });
                setTimeout(function() { loadAdmins(); }, 500);
                layui.layer.close(i);
            });
        });
    }

    loadAdmins();
    initTable({
        total: 0, limit: 1000, page: 1,
        onPageChange: function(p, l) { loadAdmins(); }
    });
</script>
</body>
</html>
