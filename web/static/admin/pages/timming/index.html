<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>定时任务</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline">
                    <input type="text" autocomplete="off" placeholder="关键词" class="layui-input" name="wd">
                </div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="window.location.href='info.html'"><i class="layui-icon">&#xe654;</i>添加任务</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>批量删除</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="50">ID</th>
                <th>任务名称</th>
                <th width="120">调度表达式</th>
                <th>执行命令</th>
                <th width="70">状态</th>
                <th width="60">执行次数</th>
                <th width="150">上次执行</th>
                <th width="150">下次执行</th>
                <th width="240">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var currentPage = 1, pageLimit = 20;
    var allTasks = [];

    function loadData(page) {
        currentPage = page || 1;
        API.get('/admin/timming/list').then(function(r) {
            if (r.code === 1) {
                var list = r.data || [];
                // 前端搜索过滤
                var wd = document.querySelector('#searchForm input[name="wd"]').value.trim().toLowerCase();
                if (wd) {
                    list = list.filter(function(t) {
                        return (t.name || '').toLowerCase().indexOf(wd) > -1 ||
                               (t.command || '').toLowerCase().indexOf(wd) > -1;
                    });
                }
                allTasks = list;
                // 前端分页
                var total = list.length;
                var start = (currentPage - 1) * pageLimit;
                var pageList = list.slice(start, start + pageLimit);
                renderTable(pageList);
                renderPag(total);
            }
        });
    }

    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr>';
            h += '<td><input type="checkbox" name="ids[]" value="' + vo.task_id + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td>' + vo.task_id + '</td>';
            h += '<td>' + htmlspecialchars(vo.name || '') + '</td>';
            h += '<td><code>' + htmlspecialchars(vo.schedule || '') + '</code></td>';
            h += '<td><span style="font-size:12px;color:#666;">' + htmlspecialchars(vo.command || '') + '</span></td>';
            h += '<td>' + (vo.status == 1
                ? '<span class="layui-badge layui-bg-green">启用</span>'
                : '<span class="layui-badge">禁用</span>') + '</td>';
            h += '<td>' + (vo.run_count || 0) + '</td>';
            h += '<td>' + (vo.last_run ? mac_day(vo.last_run, 'color') : '-') + '</td>';
            h += '<td>' + (vo.next_run ? mac_day(vo.next_run, 'color') : '-') + '</td>';
            h += '<td class="mac-table-opt-cell"><div class="mac-table-opt-btns">';
            if (vo.status == 1) {
                h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-primary" onclick="toggleTask(' + vo.task_id + ',0)">禁用</a> ';
            } else {
                h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-warm" onclick="toggleTask(' + vo.task_id + ',1)">启用</a> ';
            }
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-normal" onclick="triggerTask(' + vo.task_id + ')">执行</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-primary" onclick="window.location.href=\'info.html?id=' + vo.task_id + '\'">编辑</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-danger" onclick="delItem(' + vo.task_id + ')">删除</a>';
            h += '</div></td></tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    function renderPag(total) {
        layui.use(['laypage'], function() {
            layui.laypage.render({
                elem: 'pages', count: total, limit: pageLimit, curr: currentPage,
                layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                jump: function(o, f) { if (!f) { currentPage = o.curr; pageLimit = o.limit; renderTable(allTasks.slice((o.curr-1)*o.limit, o.curr*o.limit)); } }
            });
        });
    }

    function doSearch() { loadData(1); }

    function toggleTask(id, status) {
        var fd = new FormData();
        fd.append('status', status);
        API.form('/admin/timming/toggle/' + id, fd).then(function(r) {
            layui.use('layer', function() { layui.layer.msg(r.msg || '操作成功', {time: 1500}); });
            if (r.code === 1) loadData(currentPage);
        });
    }

    function triggerTask(id) {
        layui.use('layer', function() {
            layui.layer.confirm('确定要手动执行此任务吗？', function(i) {
                layui.layer.close(i);
                layui.layer.msg('正在执行...', {time: 30000});
                API.post('/admin/timming/trigger/' + id).then(function(r) {
                    layui.layer.closeAll();
                    layui.layer.msg(r.msg || '操作完成', {time: 2000});
                    if (r.code === 1) loadData(currentPage);
                });
            });
        });
    }

    function delItem(id) {
        layui.use('layer', function() {
            layui.layer.confirm('确定要删除此任务吗？', function(i) {
                API.post('/admin/timming/delete/' + id).then(function(r) {
                    layui.layer.msg(r.msg || '操作成功', {time: 1500});
                    if (r.code === 1) loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    function batchDel() {
        var ids = [];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e) { ids.push(e.value); });
        if (!ids.length) {
            layui.use('layer', function() { layui.layer.msg('请先选择数据'); });
            return;
        }
        layui.use('layer', function() {
            layui.layer.confirm('确定要删除选中的 ' + ids.length + ' 个任务吗？', function(i) {
                var done = 0;
                ids.forEach(function(id) {
                    API.post('/admin/timming/delete/' + id).then(function() {
                        done++;
                        if (done === ids.length) {
                            layui.layer.msg('操作完成', {time: 1500});
                            loadData(currentPage);
                        }
                    });
                });
                layui.layer.close(i);
            });
        });
    }

    loadData(1);
</script>
</body>
</html>
