<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>数据库管理</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchOptimize()"><i class="layui-icon">&#xe62c;</i>优化表</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchRepair()"><i class="layui-icon">&#xe60c;</i>修复表</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchBackup()"><i class="layui-icon">&#xe61e;</i>备份选中</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="backupAll()"><i class="layui-icon">&#xe61e;</i>备份全部</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="loadBackups()"><i class="layui-icon">&#xe621;</i>查看备份</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th>表名</th>
                <th width="100">引擎</th>
                <th width="100">行数</th>
                <th width="100">大小</th>
                <th>备注</th>
                <th width="200">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </form>
</div>

<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var allTables = [];

    function loadData() {
        API.get('/admin/database/list').then(function(r) {
            if (r.code === 1) {
                allTables = r.data.list || [];
                renderTable(allTables);
            }
        });
    }

    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr>';
            h += '<td><input type="checkbox" name="tables[]" value="' + vo.name + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td><strong>' + htmlspecialchars(vo.name || '') + '</strong></td>';
            h += '<td>' + (vo.engine || '-') + '</td>';
            h += '<td>' + (vo.rows || 0) + '</td>';
            h += '<td>' + (vo.size || '-') + '</td>';
            h += '<td>' + (vo.comment || '-') + '</td>';
            h += '<td class="mac-table-opt-cell"><div class="mac-table-opt-btns">';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-primary" onclick="optimizeTable(\'' + vo.name + '\')">优化</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-primary" onclick="repairTable(\'' + vo.name + '\')">修复</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-normal" onclick="backupTable(\'' + vo.name + '\')">备份</a>';
            h += '</div></td></tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    function getSelectedTables() {
        var tables = [];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e) { tables.push(e.value); });
        return tables;
    }

    function optimizeTable(name) {
        layui.use('layer', function() {
            layui.layer.msg('正在优化...', {time: 30000});
            API.post('/admin/database/optimize', { tables: [name] }).then(function(r) {
                layui.layer.closeAll();
                layui.layer.msg(r.msg || '操作完成', {time: 2000});
            });
        });
    }

    function repairTable(name) {
        layui.use('layer', function() {
            layui.layer.msg('正在修复...', {time: 30000});
            API.post('/admin/database/repair', { tables: [name] }).then(function(r) {
                layui.layer.closeAll();
                layui.layer.msg(r.msg || '操作完成', {time: 2000});
            });
        });
    }

    function backupTable(name) {
        layui.use('layer', function() {
            layui.layer.msg('正在备份...', {time: 30000});
            API.post('/admin/database/backup', { tables: [name] }).then(function(r) {
                layui.layer.closeAll();
                layui.layer.msg(r.msg || '操作完成', {time: 2000});
            });
        });
    }

    function batchOptimize() {
        var tables = getSelectedTables();
        if (!tables.length) { layui.use('layer', function() { layui.layer.msg('请先选择要优化的表'); }); return; }
        layui.use('layer', function() {
            layui.layer.confirm('确定要优化选中的 ' + tables.length + ' 张表吗？', function(i) {
                layui.layer.close(i);
                layui.layer.msg('正在优化...', {time: 30000});
                API.post('/admin/database/optimize', { tables: tables }).then(function(r) {
                    layui.layer.closeAll();
                    layui.layer.msg(r.msg || '操作完成', {time: 2000});
                });
            });
        });
    }

    function batchRepair() {
        var tables = getSelectedTables();
        if (!tables.length) { layui.use('layer', function() { layui.layer.msg('请先选择要修复的表'); }); return; }
        layui.use('layer', function() {
            layui.layer.confirm('确定要修复选中的 ' + tables.length + ' 张表吗？', function(i) {
                layui.layer.close(i);
                layui.layer.msg('正在修复...', {time: 30000});
                API.post('/admin/database/repair', { tables: tables }).then(function(r) {
                    layui.layer.closeAll();
                    layui.layer.msg(r.msg || '操作完成', {time: 2000});
                });
            });
        });
    }

    function batchBackup() {
        var tables = getSelectedTables();
        if (!tables.length) { layui.use('layer', function() { layui.layer.msg('请先选择要备份的表'); }); return; }
        layui.use('layer', function() {
            layui.layer.confirm('确定要备份选中的 ' + tables.length + ' 张表吗？', function(i) {
                layui.layer.close(i);
                layui.layer.msg('正在备份...', {time: 60000});
                API.post('/admin/database/backup', { tables: tables }).then(function(r) {
                    layui.layer.closeAll();
                    layui.layer.msg(r.msg || '操作完成', {time: 2000});
                });
            });
        });
    }

    function backupAll() {
        layui.use('layer', function() {
            layui.layer.confirm('确定要备份全部数据库表吗？', function(i) {
                layui.layer.close(i);
                layui.layer.msg('正在备份...', {time: 60000});
                API.post('/admin/database/backup', { tables: [] }).then(function(r) {
                    layui.layer.closeAll();
                    layui.layer.msg(r.msg || '操作完成', {time: 2000});
                });
            });
        });
    }

    function loadBackups() {
        API.get('/admin/database/backups').then(function(r) {
            if (r.code === 1 && r.data) {
                var backups = r.data.list || [];
                if (backups.length === 0) {
                    layui.use('layer', function() { layui.layer.msg('暂无备份文件'); });
                    return;
                }
                var html = '<div style="padding:10px;"><table class="layui-table" lay-size="sm"><thead><tr><th>文件名</th><th>大小</th><th>备份时间</th></tr></thead><tbody>';
                backups.forEach(function(b) {
                    html += '<tr><td>' + htmlspecialchars(b.name) + '</td><td>' + (b.size || '-') + '</td><td>' + mac_day(b.time) + '</td></tr>';
                });
                html += '</tbody></table></div>';
                layui.use('layer', function() {
                    layui.layer.open({
                        type: 1, title: '备份文件列表', area: ['600px', '400px'], content: html
                    });
                });
            }
        });
    }

    loadData();
</script>
</body>
</html>
