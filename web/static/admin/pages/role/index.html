<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>角色列表</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline">
                    <input type="text" autocomplete="off" placeholder="关键词" class="layui-input" name="keyword">
                </div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="window.location.href='info.html'"><i class="layui-icon">&#xe654;</i>添加</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>删除</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="40">ID</th>
                <th>名称</th>
                <th width="60">性别</th>
                <th width="80">演员</th>
                <th width="50">排序</th>
                <th width="50">状态</th>
                <th width="160">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script type="text/javascript">
    var currentPage = 1, pageLimit = 20;

    function loadData(page) {
        currentPage = page || 1;
        var fd = {};
        new FormData(document.getElementById('searchForm')).forEach(function(v, k) { if (v) fd[k] = v; });
        fd.page = currentPage;
        fd.page_size = pageLimit;
        var qs = Object.keys(fd).map(function(k) { return k + '=' + encodeURIComponent(fd[k]); }).join('&');
        API.get('/admin/role/list?' + qs).then(function(r) {
            if (r.code === 1 && r.data) {
                renderTable(r.data.list || []);
                renderPag(r.data.total || 0);
            }
        });
    }

    function getSexName(sex) {
        var map = { 0: '未知', 1: '男', 2: '女' };
        return map[sex] || '未知';
    }

    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr>';
            h += '<td><input type="checkbox" name="ids[]" value="' + vo.role_id + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td>' + vo.role_id + '</td>';
            h += '<td>';
            h += htmlspecialchars(vo.role_name || '');
            if (vo.role_en) h += ' <span class="layui-badge layui-bg-gray">' + htmlspecialchars(vo.role_en) + '</span>';
            h += '</td>';
            h += '<td>' + getSexName(vo.role_sex) + '</td>';
            h += '<td>' + htmlspecialchars(vo.role_actor || '-') + '</td>';
            h += '<td>' + (vo.role_sort || 0) + '</td>';
            h += '<td>' + (vo.role_status == 1 ? '<span class="layui-badge layui-bg-green">启用</span>' : '<span class="layui-badge">禁用</span>') + '</td>';
            h += '<td>';
            h += '<a href="javascript:;" class="layui-btn layui-btn-primary layui-btn-xs" onclick="window.location.href=\'info.html?id=' + vo.role_id + '\'">编辑</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-danger layui-btn-xs" onclick="delItem(' + vo.role_id + ')">删除</a>';
            h += '</td></tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    function renderPag(total) {
        layui.use(['laypage'], function() {
            layui.laypage.render({
                elem: 'pages', count: total, limit: pageLimit, curr: currentPage,
                layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                jump: function(o, f) { if (!f) loadData(o.curr); }
            });
        });
    }

    function doSearch() { loadData(1); }

    function delItem(id) {
        layui.use('layer', function() {
            layui.layer.confirm('确定删除？', function(i) {
                API.post('/admin/role/delete?ids=' + id, {}).then(function(r) {
                    layui.layer.msg(r.msg || '操作完成', { time: 1500 });
                    if (r.code === 1) loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    function batchDel() {
        var ids = [];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e) { ids.push(e.value); });
        if (!ids.length) {
            layui.use('layer', function() { layui.layer.msg('请先选择'); });
            return;
        }
        layui.use('layer', function() {
            layui.layer.confirm('确定删除' + ids.length + '条？', function(i) {
                API.post('/admin/role/delete?ids=' + ids.join(',')).then(function(r) {
                    layui.layer.msg(r.msg || '操作完成', { time: 1500 });
                    if (r.code === 1) loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    loadData(1);
    initTable({
        total: 0, limit: pageLimit, page: 1,
        onPageChange: function(p, l) { pageLimit = l; loadData(p); }
    });
</script>
</body>
</html>
