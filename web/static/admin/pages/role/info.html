<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>角色编辑</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="role_id" id="role_id" value="">

        <div class="layui-form-item">
            <label class="layui-form-label">角色名称：</label>
            <div class="layui-input-inline w300">
                <input type="text" class="layui-input" value="" name="role_name" placeholder="请输入角色名称">
            </div>
            <label class="layui-form-label">英文名：</label>
            <div class="layui-input-inline w300">
                <input type="text" class="layui-input" value="" name="role_en" placeholder="英文标识">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">性别：</label>
            <div class="layui-input-inline">
                <select name="role_sex">
                    <option value="0">未知</option>
                    <option value="1">男</option>
                    <option value="2">女</option>
                </select>
            </div>
            <label class="layui-form-label">演员：</label>
            <div class="layui-input-inline w300">
                <input type="text" class="layui-input" value="" name="role_actor" placeholder="饰演演员">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">状态：</label>
            <div class="layui-input-inline">
                <select name="role_status">
                    <option value="1">启用</option>
                    <option value="0">禁用</option>
                </select>
            </div>
            <label class="layui-form-label">锁定：</label>
            <div class="layui-input-inline">
                <select name="role_lock">
                    <option value="0">正常</option>
                    <option value="1">锁定</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">排序：</label>
            <div class="layui-input-inline w120">
                <input type="text" class="layui-input" value="0" name="role_sort" placeholder="排序值">
            </div>
            <label class="layui-form-label">等级：</label>
            <div class="layui-input-inline w120">
                <input type="text" class="layui-input" value="0" name="role_level" placeholder="等级">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">头像：</label>
            <div class="layui-input-inline w500">
                <input type="text" class="layui-input" value="" name="role_pic" placeholder="角色头像URL">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">简介：</label>
            <div class="layui-input-block">
                <textarea name="role_blurb" class="layui-textarea" placeholder="角色简介" style="height:60px;"></textarea>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">详细介绍：</label>
            <div class="layui-input-block">
                <textarea name="role_content" class="layui-textarea" placeholder="角色详细介绍" style="height:150px;"></textarea>
            </div>
        </div>

        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                <button class="layui-btn layui-btn-warm" type="reset">重置</button>
                <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script>
    var itemId = getQueryParam('id');

    function loadDetail() {
        if (!itemId) return;
        API.get('/admin/role/detail/' + itemId).then(function(r) {
            if (r.code === 1 && r.data) {
                var info = r.data;
                var f = document.getElementById('editForm');
                Object.keys(info).forEach(function(k) {
                    var el = f.querySelector('[name="' + k + '"]');
                    if (el) {
                        if (el.type === 'checkbox') el.checked = !!info[k];
                        else if (el.type === 'radio') {
                            f.querySelectorAll('[name="' + k + '"]').forEach(function(rd) {
                                rd.checked = (rd.value == info[k]);
                            });
                        } else el.value = info[k] || '';
                    }
                });
                layui.use('form', function() { layui.form.render(); });
            }
        });
    }

    loadDetail();

    bindForm('editForm', '/admin/role/save', function(r) {
        if (!itemId && r.data && r.data.role_id) {
            itemId = r.data.role_id;
            document.getElementById('role_id').value = itemId;
            window.history.replaceState({}, '', 'info.html?id=' + itemId);
        }
    });
</script>
</body>
</html>
