<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>role管理</title><link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/admin_style.css"></head><body>
<div class="page-container p10"><form class="layui-form layui-form-pane" id="editForm"><input type="hidden" name="role_id" id="role_id" value="">
<div class="layui-form-item"><label class="layui-form-label">名称：</label><div class="layui-input-inline w300"><input type="text" class="layui-input" value="" name="role_name"></div></div>
<div class="layui-form-item"><label class="layui-form-label">状态：</label><div class="layui-input-inline"><select name="role_status"><option value="1">开启</option><option value="0">关闭</option></select></div></div>
<div class="layui-form-item center"><div class="layui-input-block"><button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button><button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button></div></div>
</form></div>
<script type="text/javascript" src="../../layui/layui.js"></script><script type="text/javascript" src="../../js/app.js"></script><script>
var itemId=getQueryParam('id');function loadDetail(){if(!itemId)return;API.get('/admin/api/role/detail?id='+itemId).then(function(r){if(r.code===1&&r.data){var info=r.data,f=document.getElementById('editForm');Object.keys(info).forEach(function(k){var el=f.querySelector('[name="'+k+'"]');if(el){if(el.type==='checkbox')el.checked=!!info[k];else if(el.type==='radio')f.querySelectorAll('[name="'+k+'"]').forEach(function(rd){rd.checked=(rd.value==info[k]);});else el.value=info[k]||'';}});layui.use('form',function(){layui.form.render();});}});}loadDetail();bindForm('editForm','/admin/api/role/save',function(r){if(!itemId&&r.data&&r.data.role_id){itemId=r.data.role_id;document.getElementById('role_id').value=itemId;}});
</script></body></html>
