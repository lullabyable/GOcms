<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>漫画管理</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">

    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="manga_id" id="manga_id" value="">

        <div class="layui-tab">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
                <li>其他信息</li>
            </ul>
            <div class="layui-tab-content">

                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label">参数：</label>
                        <div class="layui-input-inline w150">
                            <select name="type_id" id="type_id"></select>
                        </div>
                        <div class="layui-input-inline w150">
                            <select name="manga_level">
                                <option value="0">选择推荐</option>
                                <option value="9">推荐9-幻灯</option>
                                <option value="1">推荐1</option>
                                <option value="2">推荐2</option>
                                <option value="3">推荐3</option>
                                <option value="4">推荐4</option>
                                <option value="5">推荐5</option>
                                <option value="6">推荐6</option>
                                <option value="7">推荐7</option>
                                <option value="8">推荐8</option>
                            </select>
                        </div>
                        <div class="layui-input-inline w120">
                            <select name="manga_status">
                                <option value="1">已审核</option>
                                <option value="0">未审核</option>
                            </select>
                        </div>
                        <div class="layui-input-inline w120">
                            <select name="manga_lock">
                                <option value="0">正常</option>
                                <option value="1">锁定</option>
                            </select>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">名称：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" placeholder="" name="manga_name" id="manga_name">
                        </div>
                        <label class="layui-form-label">副标题：</label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" value="" placeholder="" name="manga_sub" id="manga_sub">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">别名：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" placeholder="" name="manga_en">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">作者：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" placeholder="" name="manga_author" id="manga_author">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">TAG：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" placeholder="" name="manga_tag" id="manga_tag">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">备注：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" placeholder="" name="manga_remarks" id="manga_remarks">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">分类：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" placeholder="" id="manga_class" name="manga_class">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">年份：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" placeholder="" id="manga_year" name="manga_year">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">地区：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" placeholder="" id="manga_area" name="manga_area">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">语言：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" placeholder="" id="manga_lang" name="manga_lang">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">图片：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" style="max-width:100%;" value="" placeholder="" id="manga_pic" name="manga_pic">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">简介：</label>
                        <div class="layui-input-block">
                            <textarea id="manga_content" name="manga_content" style="width:99%;height:250px"></textarea>
                        </div>
                    </div>
                </div>

                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">总人气：</label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" value="" placeholder="" id="manga_hits" name="manga_hits">
                        </div>
                        <label class="layui-form-label">评分：</label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" value="" placeholder="" id="manga_score" name="manga_score">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                <button class="layui-btn layui-btn-warm" type="reset">重置</button>
                <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var itemId = getQueryParam('id');

    // 加载分类列表 (mid=3 漫画)
    function loadTypes() {
        API.get('/admin/type/list?mid=3').then(function(r) {
            if (r.code === 1 && r.data) {
                var select = document.getElementById('type_id');
                select.innerHTML = '<option value="">选择分类</option>';
                r.data.forEach(function(vo) {
                    select.innerHTML += '<option value="' + vo.type_id + '">' + vo.type_name + '</option>';
                    if (vo.child) {
                        vo.child.forEach(function(ch) {
                            select.innerHTML += '<option value="' + ch.type_id + '">&nbsp;|&nbsp;&nbsp;&nbsp;|—' + ch.type_name + '</option>';
                        });
                    }
                });
                layui.use('form', function() { layui.form.render('select'); });
            }
        });
    }

    // 加载编辑数据
    function loadDetail() {
        if (!itemId) return;
        API.get('/admin/manga/detail/' + itemId).then(function(r) {
            if (r.code === 1 && r.data) {
                var info = r.data;
                var form = document.getElementById('editForm');
                Object.keys(info).forEach(function(key) {
                    var el = form.querySelector('[name="' + key + '"]');
                    if (el) {
                        if (el.type === 'checkbox') {
                            el.checked = !!info[key];
                        } else if (el.type === 'radio') {
                            form.querySelectorAll('[name="' + key + '"]').forEach(function(radio) {
                                radio.checked = (radio.value == info[key]);
                            });
                        } else {
                            el.value = info[key] || '';
                        }
                    }
                });
                if (info.manga_content) {
                    document.getElementById('manga_content').value = info.manga_content;
                }
                layui.use('form', function() { layui.form.render(); });
            }
        });
    }

    // 初始化
    loadTypes();
    loadDetail();

    // 表单提交
    bindForm('editForm', '/admin/manga/save', function(r) {
        if (!itemId && r.data && r.data.manga_id) {
            itemId = r.data.manga_id;
            document.getElementById('manga_id').value = itemId;
            window.history.replaceState({}, '', 'info.html?id=' + itemId);
        }
    });
</script>
</body>
</html>
