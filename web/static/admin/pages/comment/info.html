<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>评论详情</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-16">评论详情</p></blockquote>
    <div id="detailBox" style="padding:10px;">加载中...</div>

    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-16">审核操作</p></blockquote>
    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="comment_id" id="comment_id" value="">
        <div class="layui-form-item">
            <label class="layui-form-label">评论内容</label>
            <div class="layui-input-block"><textarea name="comment_content" class="layui-textarea" readonly style="height:120px;"></textarea></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">回复</label>
            <div class="layui-input-block"><textarea name="comment_reply" class="layui-textarea" placeholder="输入回复内容" style="height:80px;"></textarea></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline">
                <select name="comment_status">
                    <option value="0">未审核</option>
                    <option value="1">已审核</option>
                    <option value="2">已拒绝</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script>
var itemId=getQueryParam('id');
function loadDetail(){
    if(!itemId){
        document.getElementById('detailBox').innerHTML='<p class="text-danger">未指定评论ID</p>';
        return;
    }
    API.get('/admin/comment/detail/'+itemId).then(function(r){
        if(r.code===1&&r.data){
            var info=r.data;
            // 显示评论信息概览
            var html='<table class="layui-table">';
            html+='<tr><td width="100">评论ID</td><td>'+info.comment_id+'</td></tr>';
            html+='<tr><td>关联内容</td><td>'+(info.comment_vod_id||info.comment_art_id||info.comment_did||'-')+'</td></tr>';
            html+='<tr><td>用户</td><td>'+(info.comment_user_id||info.comment_user||'匿名')+'</td></tr>';
            html+='<tr><td>IP地址</td><td>'+(info.comment_ip?long2ip(info.comment_ip):'-')+'</td></tr>';
            html+='<tr><td>评论时间</td><td>'+mac_day(info.comment_time)+'</td></tr>';
            html+='</table>';
            document.getElementById('detailBox').innerHTML=html;

            // 填充表单
            var f=document.getElementById('editForm');
            Object.keys(info).forEach(function(k){
                var el=f.querySelector('[name="'+k+'"]');
                if(el){
                    if(el.type==='checkbox')el.checked=!!info[k];
                    else el.value=info[k]||'';
                }
            });
            document.getElementById('comment_id').value=itemId;
            layui.use('form',function(){layui.form.render();});
        }else{
            document.getElementById('detailBox').innerHTML='<p class="text-danger">加载失败</p>';
        }
    });
}
loadDetail();
bindForm('editForm','/admin/comment/save');
</script>
</body>
</html>
