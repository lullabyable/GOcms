<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>评论管理</title><link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/admin_style.css"></head><body>
<div class="page-container p10"><form class="layui-form layui-form-pane" id="editForm"><input type="hidden" name="comment_id" id="comment_id" value="">
<div class="layui-form-item"><label class="layui-form-label">内容：</label><div class="layui-input-block"><textarea name="comment_content" class="layui-textarea"></textarea></div></div>
<div class="layui-form-item"><label class="layui-form-label">回复：</label><div class="layui-input-block"><textarea name="comment_reply" class="layui-textarea"></textarea></div></div>
<div class="layui-form-item"><label class="layui-form-label">状态：</label><div class="layui-input-inline"><select name="comment_status"><option value="0">未审核</option><option value="1">已审核</option></select></div></div>
<div class="layui-form-item center"><div class="layui-input-block"><button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button><button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button></div></div>
</form></div>
<script type="text/javascript" src="../../layui/layui.js"></script><script type="text/javascript" src="../../js/app.js"></script><script>
var itemId=getQueryParam('id');function loadDetail(){if(!itemId)return;API.get('/admin/api/comment/detail?id='+itemId).then(function(r){if(r.code===1&&r.data){var info=r.data,f=document.getElementById('editForm');Object.keys(info).forEach(function(k){var el=f.querySelector('[name="'+k+'"]');if(el){if(el.type==='checkbox')el.checked=!!info[k];else el.value=info[k]||'';}});layui.use('form',function(){layui.form.render();});}});}loadDetail();bindForm('editForm','/admin/api/comment/save');
</script></body></html>
