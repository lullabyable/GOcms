<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>视频列表</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
    <style>
        #pageListForm .vod-admin-name-link.layui-badge-rim {
            height: auto; min-height: 24px; line-height: 1.45; max-width: 100%;
            box-sizing: border-box; text-align: left; white-space: normal;
            overflow-wrap: anywhere; word-break: normal; padding: 6px 10px;
            vertical-align: middle; margin: 8px 0px;
        }
        #pageListForm .layui-table td:nth-child(3) .layui-badge {
            padding-top: 5px; padding-bottom: 5px; line-height: 1.35;
            min-height: 0; height: auto; box-sizing: border-box;
        }
    </style>
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" method="post" id="searchForm">
                <div class="layui-input-inline w150">
                    <select name="type" id="searchType">
                        <option value="">选择分类</option>
                    </select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="status">
                        <option value="">选择状态</option>
                        <option value="0">未审核</option>
                        <option value="1">已审核</option>
                    </select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="level">
                        <option value="">选择推荐</option>
                        <option value="9">推荐9-幻灯</option>
                        <option value="1">推荐1</option>
                        <option value="2">推荐2</option>
                        <option value="3">推荐3</option>
                        <option value="4">推荐4</option>
                        <option value="5">推荐5</option>
                        <option value="6">推荐6</option>
                        <option value="7">推荐7</option>
                        <option value="8">推荐8</option>
                    </select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="lock">
                        <option value="">选择锁定</option>
                        <option value="0">正常</option>
                        <option value="1">锁定</option>
                    </select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="isend">
                        <option value="">是否完结</option>
                        <option value="0">连载中</option>
                        <option value="1">已完结</option>
                    </select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="order">
                        <option value="">排序方式</option>
                        <option value="vod_time">更新时间</option>
                        <option value="vod_id">ID</option>
                        <option value="vod_hits">总人气</option>
                        <option value="vod_hits_month">月人气</option>
                        <option value="vod_hits_week">周人气</option>
                        <option value="vod_hits_day">日人气</option>
                    </select>
                </div>
                <div class="layui-input-inline">
                    <input type="text" autocomplete="off" placeholder="关键词" class="layui-input" name="wd">
                </div>
                <button type="button" class="layui-btn mgl-20 j-search" onclick="doSearch()">搜索</button>
            </form>
        </div>

        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="openAdd()"><i class="layui-icon">&#xe654;</i>添加</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>删除</a>
        </div>
    </div>

    <form class="layui-form" method="post" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead>
            <tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="40">ID</th>
                <th>名称</th>
                <th width="50">人气</th>
                <th width="50">周人气</th>
                <th width="40">评分</th>
                <th width="30">推荐</th>
                <th width="80">播放器</th>
                <th width="120">更新时间</th>
                <th width="200">操作</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>

<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script type="text/javascript">
    var currentPage = 1;
    var pageLimit = 20;

    // 加载分类数据
    function loadTypes() {
        API.get('/admin/api/type/list?mid=1').then(function(r) {
            if (r.code === 1 && r.data) {
                var select = document.getElementById('searchType');
                r.data.forEach(function(vo) {
                    var opt = document.createElement('option');
                    opt.value = vo.type_id;
                    opt.textContent = vo.type_name;
                    select.appendChild(opt);
                    if (vo.child) {
                        vo.child.forEach(function(ch) {
                            var opt2 = document.createElement('option');
                            opt2.value = ch.type_id;
                            opt2.textContent = '    ├ ' + ch.type_name;
                            select.appendChild(opt2);
                        });
                    }
                });
                layui.use('form', function() { layui.form.render('select'); });
            }
        });
    }

    // 加载列表数据
    function loadData(page) {
        currentPage = page || 1;
        var params = getAllParams();
        var formData = {};
        var form = document.getElementById('searchForm');
        new FormData(form).forEach(function(val, key) {
            if (val) formData[key] = val;
        });
        formData.page = currentPage;
        formData.limit = pageLimit;

        var queryStr = Object.keys(formData).map(function(k) {
            return k + '=' + encodeURIComponent(formData[k]);
        }).join('&');

        API.get('/admin/api/vod/list?' + queryStr).then(function(r) {
            if (r.code === 1) {
                renderTable(r.data.list || []);
                renderPagination(r.data.total || 0);
            }
        });
    }

    // 渲染表格
    function renderTable(list) {
        var tbody = document.getElementById('tableBody');
        var html = '';
        list.forEach(function(vo) {
            html += '<tr>';
            html += '<td><input type="checkbox" name="ids[]" value="' + vo.vod_id + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            html += '<td>' + vo.vod_id + '</td>';
            html += '<td>';
            html += '[' + (vo.type ? vo.type.type_name : '') + '] ';
            html += '<a target="_blank" class="layui-badge-rim vod-admin-name-link" href="#">' + htmlspecialchars(vo.vod_name || '') + '</a>';
            if (vo.vod_status == 0) html += ' <span class="layui-badge">未审核</span>';
            if (vo.vod_lock == 1) html += ' <span class="layui-badge">锁定</span>';
            if (vo.vod_isend == 0 && vo.vod_serial) html += ' <span class="layui-badge layui-bg-blue">连载' + vo.vod_serial + '</span>';
            if (vo.vod_remarks) html += ' <span class="layui-badge layui-bg-orange">' + vo.vod_remarks + '</span>';
            html += '</td>';
            html += '<td>' + (vo.vod_hits || 0) + '</td>';
            html += '<td>' + (vo.vod_hits_week || 0) + '</td>';
            html += '<td>' + (vo.vod_score || 0) + '</td>';
            html += '<td><span class="layui-badge layui-bg-orange">' + (vo.vod_level || 0) + '</span></td>';
            html += '<td>' + (vo.vod_play_from || '').replace(/\$\$\$/g, ',') + '</td>';
            html += '<td>' + mac_day(vo.vod_time, 'color') + '</td>';
            html += '<td class="mac-table-opt-cell">';
            html += '<div class="mac-table-opt-btns">';
            html += '<a href="javascript:;" class="layui-btn layui-btn-primary" onclick="openEdit(' + vo.vod_id + ')">编辑</a>';
            html += '<a href="javascript:;" class="layui-btn layui-btn-danger" onclick="delItem(' + vo.vod_id + ')">删除</a>';
            html += '</div></td>';
            html += '</tr>';
        });
        tbody.innerHTML = html;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    // 渲染分页
    function renderPagination(total) {
        layui.use(['laypage'], function() {
            layui.laypage.render({
                elem: 'pages',
                count: total,
                limit: pageLimit,
                curr: currentPage,
                layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                jump: function(obj, first) {
                    if (!first) {
                        loadData(obj.curr);
                    }
                }
            });
        });
    }

    // 搜索
    function doSearch() {
        loadData(1);
    }

    // 添加
    function openAdd() {
        window.location.href = 'info.html';
    }

    // 编辑
    function openEdit(id) {
        window.location.href = 'info.html?id=' + id;
    }

    // 删除
    function delItem(id) {
        layui.use('layer', function() {
            layui.layer.confirm('确定要删除吗？', function(index) {
                API.post('/admin/api/vod/del', { ids: id.toString() }).then(function(r) {
                    layui.layer.msg(r.msg || '操作成功', {time: 1500});
                    if (r.code === 1) loadData(currentPage);
                });
                layui.layer.close(index);
            });
        });
    }

    // 批量删除
    function batchDel() {
        var ids = [];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(el) {
            ids.push(el.value);
        });
        if (ids.length === 0) {
            layui.use('layer', function() { layui.layer.msg('请先选择数据'); });
            return;
        }
        layui.use('layer', function() {
            layui.layer.confirm('确定要删除选中的 ' + ids.length + ' 条数据吗？', function(index) {
                API.post('/admin/api/vod/del', { ids: ids.join(',') }).then(function(r) {
                    layui.layer.msg(r.msg || '操作成功', {time: 1500});
                    if (r.code === 1) loadData(currentPage);
                });
                layui.layer.close(index);
            });
        });
    }

    // 初始化
    loadTypes();
    loadData(1);

    initTable({
        total: 0,
        limit: pageLimit,
        page: 1,
        onPageChange: function(page, limit) {
            pageLimit = limit;
            loadData(page);
        }
    });
</script>
</body>
</html>
