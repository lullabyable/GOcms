<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>后台首页</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container">
    <blockquote class="layui-elem-quote layui-quote-nm mt10">
        <p class="f-20 text-success" id="welcomeTip">欢迎使用 GOcms 后台管理系统</p>
        <p id="loginInfo">加载中...</p>
    </blockquote>

    <table class="layui-table">
        <tbody>
        <tr>
            <td width="110">操作系统</td>
            <td id="osInfo">-</td>
        </tr>
        <tr>
            <td>服务器</td>
            <td id="hostInfo">-</td>
        </tr>
        <tr>
            <td>最大上传</td>
            <td id="uploadMax">-</td>
        </tr>
        <tr>
            <td>当前日期</td>
            <td id="dateInfo">-</td>
        </tr>
        <tr>
            <td>Go 版本</td>
            <td id="goVersion">-</td>
        </tr>
        <tr>
            <td>系统版本</td>
            <td><span class="layui-badge" id="sysVersion">GOcms v1.0</span></td>
        </tr>
        </tbody>
    </table>

    <div id="updateNotice" style="display:none;">
        <table class="tbinfo pleft layui-table">
            <thead><th colspan="2">数据库更新提示</th></thead>
            <tr><td colspan="2"><font class="tif s20">检测到数据库需要更新，请及时处理。</font></td></tr>
        </table>
    </div>
</div>

<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    // 加载系统信息
    API.get('/admin/systemInfo').then(function(r) {
        if (r.code === 1 && r.data) {
            var d = r.data;
            document.getElementById('loginInfo').textContent =
                '登录次数：' + (d.login_num || 0) +
                '  上次登录IP：' + (d.last_login_ip || '-') +
                '  上次登录时间：' + (d.last_login_time || '-');
            document.getElementById('osInfo').textContent = d.os || '-';
            document.getElementById('hostInfo').textContent = d.host || '-';
            document.getElementById('uploadMax').textContent = d.upload_max || '-';
            document.getElementById('dateInfo').textContent = d.date || new Date().toISOString().split('T')[0];
            document.getElementById('goVersion').textContent = d.go_version || '-';
            if (d.version) {
                document.getElementById('sysVersion').textContent = d.version;
            }
            if (d.need_update) {
                document.getElementById('updateNotice').style.display = '';
            }
        }
    }).catch(function() {
        document.getElementById('loginInfo').textContent = '无法获取系统信息';
        document.getElementById('osInfo').textContent = '-';
        document.getElementById('hostInfo').textContent = '-';
        document.getElementById('uploadMax').textContent = '-';
        document.getElementById('dateInfo').textContent = new Date().toISOString().split('T')[0];
        document.getElementById('goVersion').textContent = '-';
    });
</script>
</body>
</html>
