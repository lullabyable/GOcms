<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>留言管理</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline w150">
                    <select name="status">
                        <option value="">选择状态</option>
                        <option value="0">未审核</option>
                        <option value="1">已审核</option>
                    </select>
                </div>
                <div class="layui-input-inline">
                    <input type="text" autocomplete="off" placeholder="关键词" class="layui-input" name="wd">
                </div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>批量删除</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="50">ID</th>
                <th width="70">用户ID</th>
                <th>留言内容</th>
                <th>回复内容</th>
                <th width="80">状态</th>
                <th width="150">留言时间</th>
                <th width="160">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var currentPage = 1, pageLimit = 20;

    function loadData(page) {
        currentPage = page || 1;
        var fd = {};
        new FormData(document.getElementById('searchForm')).forEach(function(v, k) { if (v) fd[k] = v; });
        fd.page = currentPage;
        fd.limit = pageLimit;
        var qs = Object.keys(fd).map(function(k) { return k + '=' + encodeURIComponent(fd[k]); }).join('&');
        API.get('/admin/gbook/list?' + qs).then(function(r) {
            if (r.code === 1) {
                renderTable(r.data.list || []);
                renderPag(r.data.total || 0);
            }
        });
    }

    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr>';
            h += '<td><input type="checkbox" name="ids[]" value="' + vo.gbook_id + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td>' + vo.gbook_id + '</td>';
            h += '<td>' + vo.user_id + '</td>';
            var content = vo.gbook_content || '';
            h += '<td>' + htmlspecialchars(content.length > 60 ? content.substring(0, 60) + '...' : content) + '</td>';
            h += '<td>' + (vo.gbook_reply ? htmlspecialchars(vo.gbook_reply.length > 60 ? vo.gbook_reply.substring(0, 60) + '...' : vo.gbook_reply) : '<span style="color:#ccc">未回复</span>') + '</td>';
            h += '<td>' + (vo.gbook_status == 1
                ? '<span class="layui-badge layui-bg-green">已审核</span>'
                : '<span class="layui-badge">未审核</span>') + '</td>';
            h += '<td>' + mac_day(vo.gbook_time, 'color') + '</td>';
            h += '<td class="mac-table-opt-cell"><div class="mac-table-opt-btns">';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-warm" onclick="window.location.href=\'info.html?id=' + vo.gbook_id + '\'">回复</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-xs layui-btn-danger" onclick="delItem(' + vo.gbook_id + ')">删除</a>';
            h += '</div></td></tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    function renderPag(total) {
        layui.use(['laypage'], function() {
            layui.laypage.render({
                elem: 'pages', count: total, limit: pageLimit, curr: currentPage,
                layout: ['count', 'prev', 'page', 'next', 'limit', 'skip'],
                jump: function(o, f) { if (!f) loadData(o.curr); }
            });
        });
    }

    function doSearch() { loadData(1); }

    function delItem(id) {
        layui.use('layer', function() {
            layui.layer.confirm('确定要删除此留言吗？', function(i) {
                API.post('/admin/gbook/delete', { ids: id.toString() }).then(function(r) {
                    layui.layer.msg(r.msg || '操作成功', {time: 1500});
                    if (r.code === 1) loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    function batchDel() {
        var ids = [];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e) { ids.push(e.value); });
        if (!ids.length) {
            layui.use('layer', function() { layui.layer.msg('请先选择数据'); });
            return;
        }
        layui.use('layer', function() {
            layui.layer.confirm('确定要删除选中的 ' + ids.length + ' 条数据吗？', function(i) {
                API.post('/admin/gbook/delete', { ids: ids.join(',') }).then(function(r) {
                    layui.layer.msg(r.msg || '操作成功', {time: 1500});
                    if (r.code === 1) loadData(currentPage);
                });
                layui.layer.close(i);
            });
        });
    }

    loadData(1);
    initTable({ total: 0, limit: pageLimit, page: 1, onPageChange: function(p, l) { pageLimit = l; loadData(p); } });
</script>
</body>
</html>
