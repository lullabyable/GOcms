<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>访问统计</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-20">访问统计概览</p></blockquote>
    <div id="statsBox" class="layui-row layui-col-space10 mb20" style="padding:10px;">加载中...</div>

    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-16">访问日志</p></blockquote>
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline"><input type="text" autocomplete="off" placeholder="IP地址" class="layui-input" name="ip"></div>
                <div class="layui-input-inline"><input type="text" autocomplete="off" placeholder="URL关键词" class="layui-input" name="url"></div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="40">ID</th>
                <th width="140">IP地址</th>
                <th>访问URL</th>
                <th width="200">来源</th>
                <th width="200">User-Agent</th>
                <th width="150">访问时间</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var currentPage=1,pageLimit=20;

    // 加载统计数据
    function loadStats(){
        API.get('/admin/visit/stats').then(function(r){
            if(r.code===1&&r.data){
                var d=r.data;
                var html='';
                html+='<div class="layui-col-xs3"><div class="layui-card"><div class="layui-card-header">今日访问</div><div class="layui-card-body f-20">'+(d.today||0)+'</div></div></div>';
                html+='<div class="layui-col-xs3"><div class="layui-card"><div class="layui-card-header">昨日访问</div><div class="layui-card-body f-20">'+(d.yesterday||0)+'</div></div></div>';
                html+='<div class="layui-col-xs3"><div class="layui-card"><div class="layui-card-header">本周访问</div><div class="layui-card-body f-20">'+(d.week||0)+'</div></div></div>';
                html+='<div class="layui-col-xs3"><div class="layui-card"><div class="layui-card-header">本月访问</div><div class="layui-card-body f-20">'+(d.month||0)+'</div></div></div>';
                document.getElementById('statsBox').innerHTML=html;
            }else{
                document.getElementById('statsBox').innerHTML='<div class="layui-col-xs12">暂无统计数据</div>';
            }
        }).catch(function(){
            document.getElementById('statsBox').innerHTML='<div class="layui-col-xs12">无法获取统计数据</div>';
        });
    }

    // 加载访问日志列表
    function loadData(page){
        currentPage=page||1;
        var fd={};
        new FormData(document.getElementById('searchForm')).forEach(function(v,k){if(v)fd[k]=v;});
        fd.page=currentPage;fd.limit=pageLimit;
        var qs=Object.keys(fd).map(function(k){return k+'='+encodeURIComponent(fd[k]);}).join('&');
        API.get('/admin/visit/list?'+qs).then(function(r){
            if(r.code===1){
                renderTable(r.data.list||[]);
                renderPag(r.data.total||0);
            }
        });
    }

    function renderTable(list){
        var h='';
        list.forEach(function(vo){
            var ipStr=long2ip(vo.visit_ip);
            var ua=htmlspecialchars(vo.visit_ua||'');
            if(ua.length>60)ua=ua.substring(0,60)+'...';
            var referer=htmlspecialchars(vo.visit_referer||'');
            if(referer.length>50)referer=referer.substring(0,50)+'...';
            h+='<tr>';
            h+='<td>'+vo.visit_id+'</td>';
            h+='<td>'+htmlspecialchars(ipStr)+'</td>';
            h+='<td>'+htmlspecialchars(vo.visit_url||'')+'</td>';
            h+='<td>'+referer+'</td>';
            h+='<td title="'+htmlspecialchars(vo.visit_ua||'')+'">'+ua+'</td>';
            h+='<td>'+mac_day(vo.visit_time,'color')+'</td>';
            h+='</tr>';
        });
        document.getElementById('tableBody').innerHTML=h;
    }

    function renderPag(total){
        layui.use(['laypage'],function(){
            layui.laypage.render({
                elem:'pages',count:total,limit:pageLimit,curr:currentPage,
                layout:['count','prev','page','next','limit','skip'],
                jump:function(o,f){if(!f)loadData(o.curr);}
            });
        });
    }

    function doSearch(){loadData(1);}

    loadStats();
    loadData(1);
    initTable({total:0,limit:pageLimit,page:1,onPageChange:function(p,l){pageLimit=l;loadData(p);}});
</script>
</body>
</html>
