<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>访问统计</title><link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/admin_style.css"></head><body>
<div class="page-container p10">
    <blockquote class="layui-elem-quote layui-quote-nm mt10"><p class="f-20">访问统计</p></blockquote>
    <div id="stats" style="padding:20px;">加载中...</div>
</div>
<script type="text/javascript" src="../../layui/layui.js"></script><script type="text/javascript" src="../../js/app.js"></script><script>
API.get('/admin/api/analytics/dashboard').then(function(r){
    if(r.code===1&&r.data){
        var d=r.data;
        var html='<table class="layui-table"><tbody>';
        html+='<tr><td>今日访问</td><td>'+(d.today||0)+'</td><td>昨日访问</td><td>'+(d.yesterday||0)+'</td></tr>';
        html+='<tr><td>本周访问</td><td>'+(d.week||0)+'</td><td>本月访问</td><td>'+(d.month||0)+'</td></tr>';
        html+='<tr><td>总访问量</td><td>'+(d.total||0)+'</td><td>在线人数</td><td>'+(d.online||0)+'</td></tr>';
        html+='</tbody></table>';
        document.getElementById('stats').innerHTML=html;
    }
}).catch(function(){document.getElementById('stats').innerHTML='无法获取统计数据';});
</script></body></html>
