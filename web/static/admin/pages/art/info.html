<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>文章管理</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="art_id" id="art_id" value="">
        <div class="layui-tab">
            <ul class="layui-tab-title"><li class="layui-this">基本信息</li><li>其他信息</li></ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label">参数：</label>
                        <div class="layui-input-inline w150"><select name="type_id" lay-filter="type_id" id="type_id"></select></div>
                        <div class="layui-input-inline w150"><select name="art_level"><option value="0">选择推荐</option><option value="9">推荐9-幻灯</option><option value="1">推荐1</option><option value="2">推荐2</option><option value="3">推荐3</option><option value="4">推荐4</option><option value="5">推荐5</option><option value="6">推荐6</option><option value="7">推荐7</option><option value="8">推荐8</option></select></div>
                        <div class="layui-input-inline w150"><select name="art_status"><option value="1">已审核</option><option value="0">未审核</option></select></div>
                        <div class="layui-input-inline w150"><select name="art_lock"><option value="0">正常</option><option value="1">锁定</option></select></div>
                        <div class="layui-input-inline"><input type="checkbox" name="uptime" title="更新时间" value="1" checked lay-skin="primary"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">名称：</label>
                        <div class="layui-input-inline w500"><input type="text" class="layui-input" value="" name="art_name"></div>
                        <label class="layui-form-label">副标题：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" name="art_sub"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">别名：</label>
                        <div class="layui-input-inline w500"><input type="text" class="layui-input" value="" name="art_en"></div>
                        <label class="layui-form-label">首字母：</label>
                        <div class="layui-input-inline w70"><input type="text" class="layui-input" value="" name="art_letter"></div>
                        <label class="layui-form-label">颜色：</label>
                        <div class="layui-input-inline w70"><input type="text" class="layui-input" value="" name="art_color"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">TAG：</label>
                        <div class="layui-input-inline w500"><input type="text" class="layui-input" value="" name="art_tag"></div>
                        <div class="layui-input-inline w120"><input type="checkbox" name="uptag" title="自动生成" value="1" lay-skin="primary"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">备注：</label>
                        <div class="layui-input-inline w500"><input type="text" class="layui-input" value="" name="art_remarks"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">关联视频：</label>
                        <div class="layui-input-inline w500"><input type="text" class="layui-input" value="" placeholder="输入关联视频ID" name="art_rel_vod"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">关联文章：</label>
                        <div class="layui-input-inline w500"><input type="text" class="layui-input" value="" placeholder="输入关联文章ID" name="art_rel_art"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">分类：</label>
                        <div class="layui-input-inline w500"><input type="text" class="layui-input" value="" id="art_class" name="art_class"></div>
                        <div class="layui-input-inline w500 art_class_label"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">图片：</label>
                        <div class="layui-input-inline w500 upload"><input type="text" class="layui-input upload-input" value="" id="art_pic" name="art_pic"></div>
                        <div class="layui-input-inline"><button type="button" class="layui-btn layui-upload" id="upload1">上传图片</button></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">缩略图：</label>
                        <div class="layui-input-inline w500 upload"><input type="text" class="layui-input upload-input upload-thumb" value="" id="art_pic_thumb" name="art_pic_thumb"></div>
                        <div class="layui-input-inline"><button type="button" class="layui-btn layui-upload" id="upload2">上传图片</button></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">简介：</label>
                        <div class="layui-input-block"><textarea name="art_blurb" class="layui-textarea" placeholder="不填则自动截取" style="height:40px;"></textarea></div>
                    </div>
                    <div id="artlist" class="contents"></div>
                    <div class="layui-form-item">
                        <label><button class="layui-btn radius j-editor-add" type="button">+ 添加分页</button></label>
                        <div class="layui-input-block"></div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">顶：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" id="art_up" name="art_up"></div>
                        <label class="layui-form-label">踩：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" id="art_down" name="art_down"></div>
                        <button class="layui-btn" type="button" id="btn_rnd">随机生成</button>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">总人气：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" id="art_hits" name="art_hits"></div>
                        <label class="layui-form-label">月人气：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" id="art_hits_month" name="art_hits_month"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">周人气：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" id="art_hits_week" name="art_hits_week"></div>
                        <label class="layui-form-label">日人气：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" id="art_hits_day" name="art_hits_day"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">评分：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" id="art_score" name="art_score"></div>
                        <label class="layui-form-label">总评分：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" id="art_score_all" name="art_score_all"></div>
                        <label class="layui-form-label">评分次数：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" id="art_score_num" name="art_score_num"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">总积分：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" name="art_points"></div>
                        <label class="layui-form-label">详情积分：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" name="art_points_detail"></div>
                        <label class="layui-form-label">模板：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" name="art_tpl"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">作者：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" name="art_author"></div>
                        <label class="layui-form-label">来源：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" name="art_from"></div>
                        <label class="layui-form-label">跳转URL：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" name="art_jumpurl"></div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">访问密码：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" placeholder="留空则不生效" name="art_pwd"></div>
                        <label class="layui-form-label">密码提示：</label>
                        <div class="layui-input-inline"><input type="text" class="layui-input" value="" name="art_pwd_url"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                <button class="layui-btn layui-btn-warm" type="reset">重置</button>
                <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="../../layui/layui.js"></script>
<script type="text/javascript" src="../../js/app.js"></script>
<script type="text/javascript">
    var artId = getQueryParam('id');
    var contentArrLen = 0;
    function loadTypes() {
        API.get('/admin/type/list?mid=2').then(function(r) {
            if (r.code === 1 && r.data) {
                var s = document.getElementById('type_id');
                s.innerHTML = '<option value="">选择分类</option>';
                r.data.forEach(function(v) { s.innerHTML += '<option value="'+v.type_id+'">'+v.type_name+'</option>'; if(v.child) v.child.forEach(function(c){ s.innerHTML += '<option value="'+c.type_id+'">&nbsp;|&nbsp;&nbsp;&nbsp;|—'+c.type_name+'</option>'; }); });
                layui.use('form', function(){ layui.form.render('select'); });
            }
        });
    }
    function addContentPage(data) {
        contentArrLen++;
        var i = contentArrLen;
        var div = document.createElement('div');
        div.className = 'layui-form-item'; div.setAttribute('data-i', i);
        div.innerHTML = '<label class="layui-form-label">内容'+i+'：</label>' +
            '<div class="layui-input-inline w200"><input type="text" name="art_title[]" class="layui-input" value="'+(data?data.title:'')+'" placeholder="页面标题"></div>' +
            '<div class="layui-input-inline w200"><input type="text" name="art_note[]" class="layui-input" value="'+(data?data.note:'')+'" placeholder="备注"></div>' +
            '<div class="layui-input-inline w200"><a href="javascript:void(0)" class="j-editor-clear">清空</a>&nbsp;<a href="javascript:void(0)" class="j-editor-remove">删除</a>&nbsp;<a href="javascript:void(0)" class="j-editor-up">上移</a>&nbsp;<a href="javascript:void(0)" class="j-editor-down">下移</a></div>' +
            '<div class="p10 m20"></div>' +
            '<div class="layui-input-block"><textarea id="art_content'+i+'" name="art_content[]" style="width:99%;height:250px">'+(data?data.content:'')+'</textarea></div>';
        document.getElementById('artlist').appendChild(div);
    }
    document.addEventListener('click', function(e) {
        var p = e.target.closest('.layui-form-item'); if (!p) return;
        if (e.target.classList.contains('j-editor-clear')) { p.querySelector('textarea').value=''; }
        else if (e.target.classList.contains('j-editor-remove')) { p.remove(); }
        else if (e.target.classList.contains('j-editor-up')) { var prev=p.previousElementSibling; if(prev&&prev.classList.contains('layui-form-item')) p.parentNode.insertBefore(p,prev); }
        else if (e.target.classList.contains('j-editor-down')) { var next=p.nextElementSibling; if(next&&next.classList.contains('layui-form-item')) p.parentNode.insertBefore(next,p); }
    });
    document.querySelector('.j-editor-add').addEventListener('click', function(){ addContentPage(); });
    function loadDetail() {
        if (!artId) { addContentPage(); return; }
        API.get('/admin/art/detail/'+artId).then(function(r) {
            if (r.code === 1 && r.data) {
                var info = r.data;
                var form = document.getElementById('editForm');
                Object.keys(info).forEach(function(k) {
                    var el = form.querySelector('[name="'+k+'"]');
                    if (el) { if (el.type==='checkbox') el.checked=!!info[k]; else if (el.type==='radio') form.querySelectorAll('[name="'+k+'"]').forEach(function(rd){rd.checked=(rd.value==info[k]);}); else el.value=info[k]||''; }
                });
                if (info.art_page_list) info.art_page_list.forEach(function(p){ addContentPage(p); });
                layui.use('form', function(){ layui.form.render(); });
            }
        });
    }
    loadTypes(); loadDetail();
    bindForm('editForm', '/admin/art/save', function(r) {
        if (!artId && r.data && r.data.art_id) { artId=r.data.art_id; document.getElementById('art_id').value=artId; }
    });
    document.getElementById('btn_rnd').addEventListener('click', function() {
        ['art_hits','art_hits_month','art_hits_week','art_hits_day','art_up','art_down','art_score','art_score_all','art_score_num'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=rndNum(5000,9999); });
    });
    layui.use('form', function(){ layui.form.on('select(type_id)', function(data){ if(data.value) API.post('/admin/type/extend',{id:data.value}).then(function(r){ if(r.code===1&&r.data) Object.keys(r.data).forEach(function(k){ var l=document.querySelector('.art_'+k+'_label'); if(l){ l.innerHTML=''; if(r.data[k]) r.data[k].forEach(function(v){ l.innerHTML+='<a class="layui-btn layui-btn-xs extend" href="javascript:;" data-id="art_'+k+'">'+v+'</a>'; }); } }); }); }); });
    document.addEventListener('click', function(e){ if(e.target.classList.contains('extend')){ var id=e.target.getAttribute('data-id'),inp=document.getElementById(id); if(inp){ if(id==='art_class'){var v=inp.value;if(v&&v.indexOf(e.target.textContent)===-1) inp.value=v+','+e.target.textContent;else if(!v) inp.value=e.target.textContent;} else inp.value=e.target.textContent; } } });
</script>
</body>
</html>
