<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>文章列表</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline w150">
                    <select name="type" id="searchType"><option value="">选择分类</option></select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="status"><option value="">选择状态</option><option value="0">未审核</option><option value="1">已审核</option></select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="level"><option value="">选择推荐</option><option value="9">推荐9-幻灯</option><option value="1">推荐1</option><option value="2">推荐2</option><option value="3">推荐3</option><option value="4">推荐4</option><option value="5">推荐5</option><option value="6">推荐6</option><option value="7">推荐7</option><option value="8">推荐8</option></select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="lock"><option value="">选择锁定</option><option value="0">正常</option><option value="1">锁定</option></select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="order"><option value="">排序方式</option><option value="art_time">更新时间</option><option value="art_id">ID</option><option value="art_hits">总人气</option><option value="art_hits_month">月人气</option><option value="art_hits_week">周人气</option><option value="art_hits_day">日人气</option></select>
                </div>
                <div class="layui-input-inline"><input type="text" autocomplete="off" placeholder="关键词" class="layui-input" name="wd"></div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="window.location.href='info.html'"><i class="layui-icon">&#xe654;</i>添加</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>删除</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="40">ID</th><th>名称</th><th width="50">人气</th><th width="40">评分</th><th width="30">推荐</th><th width="80">作者</th><th width="120">更新时间</th><th width="200">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var currentPage = 1, pageLimit = 20;
    function loadTypes() {
        API.get('/admin/type/list?mid=2').then(function(r) {
            if (r.code === 1 && r.data) {
                var s = document.getElementById('searchType');
                r.data.forEach(function(v) { s.innerHTML += '<option value="'+v.type_id+'">'+v.type_name+'</option>'; if(v.child) v.child.forEach(function(c){ s.innerHTML += '<option value="'+c.type_id+'">&nbsp;&nbsp;├ '+c.type_name+'</option>'; }); });
                layui.use('form', function(){ layui.form.render('select'); });
            }
        });
    }
    function loadData(page) {
        currentPage = page || 1;
        var fd = {}; new FormData(document.getElementById('searchForm')).forEach(function(v,k){ if(v) fd[k]=v; });
        fd.page = currentPage; fd.limit = pageLimit;
        var qs = Object.keys(fd).map(function(k){ return k+'='+encodeURIComponent(fd[k]); }).join('&');
        API.get('/admin/art/list?'+qs).then(function(r) {
            if (r.code === 1) { renderTable(r.data.list||[]); renderPag(r.data.total||0); }
        });
    }
    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr><td><input type="checkbox" name="ids[]" value="'+vo.art_id+'" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td>'+vo.art_id+'</td><td>['+(vo.type?vo.type.type_name:'')+'] <a target="_blank" class="layui-badge-rim" href="#">'+htmlspecialchars(vo.art_name||'')+'</a>';
            if(vo.art_status==0) h += ' <span class="layui-badge">未审核</span>';
            if(vo.art_lock==1) h += ' <span class="layui-badge">锁定</span>';
            h += '</td><td>'+(vo.art_hits||0)+'</td><td>'+(vo.art_score||0)+'</td><td><span class="layui-badge layui-bg-orange">'+(vo.art_level||0)+'</span></td>';
            h += '<td>'+(vo.art_author||'')+'</td><td>'+mac_day(vo.art_time,'color')+'</td>';
            h += '<td><a href="javascript:;" class="layui-btn layui-btn-primary" onclick="window.location.href=\'info.html?id='+vo.art_id+'\'">编辑</a> <a href="javascript:;" class="layui-btn layui-btn-danger" onclick="delItem('+vo.art_id+')">删除</a></td></tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function(){ layui.form.render('checkbox'); });
    }
    function renderPag(total) { layui.use(['laypage'], function(){ layui.laypage.render({ elem:'pages', count:total, limit:pageLimit, curr:currentPage, layout:['count','prev','page','next','limit','skip'], jump:function(o,f){ if(!f) loadData(o.curr); } }); }); }
    function doSearch() { loadData(1); }
    function delItem(id) { layui.use('layer',function(){ layui.layer.confirm('确定删除？',function(i){ API.post('/admin/art/delete',{ids:id.toString()}).then(function(r){ layui.layer.msg(r.msg||'操作完成',{time:1500}); if(r.code===1) loadData(currentPage); }); layui.layer.close(i); }); }); }
    function batchDel() { var ids=[]; document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e){ids.push(e.value);}); if(!ids.length){layui.use('layer',function(){layui.layer.msg('请先选择');});return;} layui.use('layer',function(){ layui.layer.confirm('确定删除'+ids.length+'条？',function(i){ API.post('/admin/art/delete',{ids:ids.join(',')}).then(function(r){ layui.layer.msg(r.msg||'操作完成',{time:1500}); if(r.code===1) loadData(currentPage); }); layui.layer.close(i); }); }); }
    loadTypes(); loadData(1);
    initTable({total:0,limit:pageLimit,page:1,onPageChange:function(p,l){pageLimit=l;loadData(p);}});
</script>
</body>
</html>
