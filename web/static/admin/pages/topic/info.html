<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>专题管理</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">

    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="topic_id" id="topic_id" value="">

        <div class="layui-form-item">
            <label class="layui-form-label">名称：</label>
            <div class="layui-input-inline w500">
                <input type="text" class="layui-input" value="" placeholder="" name="topic_name" id="topic_name">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">别名：</label>
            <div class="layui-input-inline w500">
                <input type="text" class="layui-input" value="" placeholder="" name="topic_en" id="topic_en">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">图片：</label>
            <div class="layui-input-inline w500">
                <input type="text" class="layui-input" style="max-width:100%;" value="" placeholder="" id="topic_pic" name="topic_pic">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">关键词：</label>
            <div class="layui-input-inline w500">
                <input type="text" class="layui-input" value="" placeholder="" name="topic_keywords" id="topic_keywords">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">描述：</label>
            <div class="layui-input-block">
                <textarea name="topic_description" rows="3" class="layui-textarea" placeholder="" style="height:60px;"></textarea>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">排序：</label>
            <div class="layui-input-inline">
                <input type="text" class="layui-input" value="0" placeholder="" name="topic_sort" id="topic_sort">
            </div>
            <label class="layui-form-label">状态：</label>
            <div class="layui-input-inline w120">
                <select name="topic_status">
                    <option value="1">开启</option>
                    <option value="0">关闭</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">内容：</label>
            <div class="layui-input-block">
                <textarea id="topic_content" name="topic_content" style="width:99%;height:250px"></textarea>
            </div>
        </div>

        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                <button class="layui-btn layui-btn-warm" type="reset">重置</button>
                <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
            </div>
        </div>
    </form>
</div>

<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var itemId = getQueryParam('id');

    // 加载编辑数据
    function loadDetail() {
        if (!itemId) return;
        API.get('/admin/topic/detail/' + itemId).then(function(r) {
            if (r.code === 1 && r.data) {
                var info = r.data;
                var form = document.getElementById('editForm');
                Object.keys(info).forEach(function(key) {
                    var el = form.querySelector('[name="' + key + '"]');
                    if (el) {
                        if (el.type === 'checkbox') {
                            el.checked = !!info[key];
                        } else if (el.type === 'radio') {
                            form.querySelectorAll('[name="' + key + '"]').forEach(function(radio) {
                                radio.checked = (radio.value == info[key]);
                            });
                        } else {
                            el.value = info[key] || '';
                        }
                    }
                });
                if (info.topic_content) {
                    document.getElementById('topic_content').value = info.topic_content;
                }
                layui.use('form', function() { layui.form.render(); });
            }
        });
    }

    // 初始化
    loadDetail();

    // 表单提交
    bindForm('editForm', '/admin/topic/save', function(r) {
        if (!itemId && r.data && r.data.topic_id) {
            itemId = r.data.topic_id;
            document.getElementById('topic_id').value = itemId;
            window.history.replaceState({}, '', 'info.html?id=' + itemId);
        }
    });
</script>
</body>
</html>
