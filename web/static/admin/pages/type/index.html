<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>分类管理</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <div class="my-toolbar-box">
        <div class="center mb10">
            <form class="layui-form" id="searchForm">
                <div class="layui-input-inline w150">
                    <select name="type_mid">
                        <option value="">全部类型</option>
                        <option value="1">视频</option>
                        <option value="2">文章</option>
                        <option value="3">漫画</option>
                    </select>
                </div>
                <div class="layui-input-inline w150">
                    <select name="type_status">
                        <option value="">全部状态</option>
                        <option value="1">开启</option>
                        <option value="0">关闭</option>
                    </select>
                </div>
                <div class="layui-input-inline">
                    <input type="text" autocomplete="off" placeholder="关键词" class="layui-input" name="wd">
                </div>
                <button type="button" class="layui-btn mgl-20" onclick="doSearch()">搜索</button>
            </form>
        </div>
        <div class="layui-btn-group">
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="window.location.href='info.html'"><i class="layui-icon">&#xe654;</i>添加</a>
            <a href="javascript:;" class="layui-btn layui-btn-primary" onclick="batchDel()"><i class="layui-icon">&#xe640;</i>删除</a>
        </div>
    </div>
    <form class="layui-form" id="pageListForm">
        <table class="layui-table" lay-size="sm">
            <thead><tr>
                <th width="25"><input type="checkbox" lay-skin="primary" lay-filter="allChoose"></th>
                <th width="40">ID</th>
                <th>名称</th>
                <th width="60">类型</th>
                <th width="50">状态</th>
                <th width="50">排序</th>
                <th width="200">操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="pages" class="center"></div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script type="text/javascript">
    var typeData = [];

    function loadTypes() {
        API.get('/admin/type/list').then(function(r) {
            if (r.code === 1 && r.data) {
                typeData = Array.isArray(r.data) ? r.data : (r.data.list || []);
                // 客户端过滤
                var fd = {};
                new FormData(document.getElementById('searchForm')).forEach(function(v, k) { if (v) fd[k] = v; });
                var filtered = typeData.filter(function(vo) {
                    if (fd.type_mid && vo.type_mid != fd.type_mid) return false;
                    if (fd.type_status !== undefined && fd.type_status !== '' && vo.type_status != fd.type_status) return false;
                    if (fd.wd) {
                        var wd = fd.wd.toLowerCase();
                        if ((vo.type_name || '').toLowerCase().indexOf(wd) === -1 &&
                            (vo.type_en || '').toLowerCase().indexOf(wd) === -1) return false;
                    }
                    return true;
                });
                renderTable(filtered);
                renderPag(filtered.length);
            }
        });
    }

    function getMidName(mid) {
        var map = { 1: '视频', 2: '文章', 3: '漫画' };
        return map[mid] || '未知';
    }

    function renderTable(list) {
        var h = '';
        list.forEach(function(vo) {
            h += '<tr>';
            h += '<td><input type="checkbox" name="ids[]" value="' + vo.type_id + '" class="layui-checkbox checkbox-ids" lay-skin="primary"></td>';
            h += '<td>' + vo.type_id + '</td>';
            h += '<td>';
            if (vo.type_pid > 0) h += '　├ ';
            h += htmlspecialchars(vo.type_name || '');
            if (vo.type_en) h += ' <span class="layui-badge layui-bg-gray">' + htmlspecialchars(vo.type_en) + '</span>';
            h += '</td>';
            h += '<td><span class="layui-badge layui-bg-blue">' + getMidName(vo.type_mid) + '</span></td>';
            h += '<td>' + (vo.type_status == 1 ? '<span class="layui-badge layui-bg-green">开启</span>' : '<span class="layui-badge">关闭</span>') + '</td>';
            h += '<td>' + (vo.type_sort || 0) + '</td>';
            h += '<td>';
            h += '<a href="javascript:;" class="layui-btn layui-btn-primary layui-btn-xs" onclick="window.location.href=\'info.html?id=' + vo.type_id + '\'">编辑</a> ';
            h += '<a href="javascript:;" class="layui-btn layui-btn-danger layui-btn-xs" onclick="delItem(' + vo.type_id + ')">删除</a>';
            h += '</td></tr>';
        });
        document.getElementById('tableBody').innerHTML = h;
        layui.use('form', function() { layui.form.render('checkbox'); });
    }

    function renderPag(total) {
        layui.use(['laypage'], function() {
            layui.laypage.render({
                elem: 'pages', count: total, limit: 1000, curr: 1,
                layout: ['count', 'prev', 'page', 'next', 'skip'],
                jump: function(o, f) {}
            });
        });
    }

    function doSearch() { loadTypes(); }

    function delItem(id) {
        layui.use('layer', function() {
            layui.layer.confirm('确定删除？', function(i) {
                API.post('/admin/type/delete/' + id, {}).then(function(r) {
                    layui.layer.msg(r.msg || '操作完成', { time: 1500 });
                    if (r.code === 1) loadTypes();
                });
                layui.layer.close(i);
            });
        });
    }

    function batchDel() {
        var ids = [];
        document.querySelectorAll('input.checkbox-ids:checked').forEach(function(e) { ids.push(e.value); });
        if (!ids.length) {
            layui.use('layer', function() { layui.layer.msg('请先选择'); });
            return;
        }
        layui.use('layer', function() {
            layui.layer.confirm('确定删除' + ids.length + '条？', function(i) {
                ids.forEach(function(id) {
                    API.post('/admin/type/delete/' + id, {}).then(function(r) {
                        layui.layer.msg(r.msg || '操作完成', { time: 1500 });
                    });
                });
                setTimeout(function() { loadTypes(); }, 500);
                layui.layer.close(i);
            });
        });
    }

    loadTypes();
    initTable({
        total: 0, limit: 1000, page: 1,
        onPageChange: function(p, l) { loadTypes(); }
    });
</script>
</body>
</html>
