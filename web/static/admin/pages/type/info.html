<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>分类管理</title><link rel="stylesheet" href="../../layui/css/layui.css"><link rel="stylesheet" href="../../css/admin_style.css"></head><body>
<div class="page-container p10"><form class="layui-form layui-form-pane" id="editForm"><input type="hidden" name="type_id" id="type_id" value="">
<div class="layui-form-item"><label class="layui-form-label">分类名称：</label><div class="layui-input-inline w300"><input type="text" class="layui-input" value="" name="type_name"></div></div>
<div class="layui-form-item"><label class="layui-form-label">英文名：</label><div class="layui-input-inline w300"><input type="text" class="layui-input" value="" name="type_en"></div></div>
<div class="layui-form-item"><label class="layui-form-label">类型：</label><div class="layui-input-inline"><select name="type_mid"><option value="1">视频</option><option value="2">文章</option><option value="3">漫画</option></select></div></div>
<div class="layui-form-item"><label class="layui-form-label">状态：</label><div class="layui-input-inline"><select name="type_status"><option value="1">开启</option><option value="0">关闭</option></select></div></div>
<div class="layui-form-item"><label class="layui-form-label">排序：</label><div class="layui-input-inline"><input type="text" class="layui-input" value="" name="type_sort"></div></div>
<div class="layui-form-item"><label class="layui-form-label">分类模板：</label><div class="layui-input-inline"><input type="text" class="layui-input" value="" name="type_tpl"></div></div>
<div class="layui-form-item"><label class="layui-form-label">列表模板：</label><div class="layui-input-inline"><input type="text" class="layui-input" value="" name="type_tpl_list"></div></div>
<div class="layui-form-item"><label class="layui-form-label">详情模板：</label><div class="layui-input-inline"><input type="text" class="layui-input" value="" name="type_tpl_detail"></div></div>
<div class="layui-form-item center"><div class="layui-input-block"><button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button><button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button></div></div>
</form></div>
<script type="text/javascript" src="../../layui/layui.js"></script><script type="text/javascript" src="../../js/app.js"></script><script>
var itemId=getQueryParam('id');function loadDetail(){if(!itemId)return;API.get('/admin/type/detail/'+itemId).then(function(r){if(r.code===1&&r.data){var info=r.data,f=document.getElementById('editForm');Object.keys(info).forEach(function(k){var el=f.querySelector('[name="'+k+'"]');if(el){if(el.type==='checkbox')el.checked=!!info[k];else if(el.type==='radio')f.querySelectorAll('[name="'+k+'"]').forEach(function(rd){rd.checked=(rd.value==info[k]);});else el.value=info[k]||'';}});layui.use('form',function(){layui.form.render();});}});}loadDetail();bindForm('editForm','/admin/type/save',function(r){if(!itemId&&r.data&&r.data.type_id){itemId=r.data.type_id;document.getElementById('type_id').value=itemId;}});
</script></body></html>
