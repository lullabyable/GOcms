<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>分类编辑</title>
    <link rel="stylesheet" href="/layui/css/layui.css">
    <link rel="stylesheet" href="/css/admin_style.css">
</head>
<body>
<div class="page-container p10">
    <form class="layui-form layui-form-pane" id="editForm">
        <input type="hidden" name="type_id" id="type_id" value="">

        <div class="layui-tab">
            <ul class="layui-tab-title">
                <li class="layui-this">基本信息</li>
                <li>SEO信息</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="layui-form-item">
                        <label class="layui-form-label">分类名称：</label>
                        <div class="layui-input-inline w300">
                            <input type="text" class="layui-input" value="" name="type_name" placeholder="请输入分类名称">
                        </div>
                        <label class="layui-form-label">英文名：</label>
                        <div class="layui-input-inline w300">
                            <input type="text" class="layui-input" value="" name="type_en" placeholder="英文标识">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">所属模型：</label>
                        <div class="layui-input-inline">
                            <select name="type_mid" lay-filter="type_mid">
                                <option value="1">视频</option>
                                <option value="2">文章</option>
                                <option value="3">漫画</option>
                            </select>
                        </div>
                        <label class="layui-form-label">父分类：</label>
                        <div class="layui-input-inline">
                            <select name="type_pid" id="type_pid">
                                <option value="0">无（顶级分类）</option>
                            </select>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">状态：</label>
                        <div class="layui-input-inline">
                            <select name="type_status">
                                <option value="1">开启</option>
                                <option value="0">关闭</option>
                            </select>
                        </div>
                        <label class="layui-form-label">排序：</label>
                        <div class="layui-input-inline w120">
                            <input type="text" class="layui-input" value="0" name="type_sort" placeholder="数值越大越靠前">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">首字母：</label>
                        <div class="layui-input-inline w120">
                            <input type="text" class="layui-input" value="" name="type_letter" placeholder="如: D">
                        </div>
                        <label class="layui-form-label">颜色：</label>
                        <div class="layui-input-inline w120">
                            <input type="text" class="layui-input" value="" name="type_color" placeholder="#ff0000">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">分类图片：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" name="type_pic" placeholder="图片地址">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">跳转URL：</label>
                        <div class="layui-input-inline w500">
                            <input type="text" class="layui-input" value="" name="type_jumpurl" placeholder="留空不跳转">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">分类模板：</label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" value="" name="type_tpl_list" placeholder="如: type/list.html">
                        </div>
                        <label class="layui-form-label">详情模板：</label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" value="" name="type_tpl_detail" placeholder="如: vod/detail.html">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">播放模板：</label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" value="" name="type_tpl_play" placeholder="如: vod/play.html">
                        </div>
                        <label class="layui-form-label">下载模板：</label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" value="" name="type_tpl_down" placeholder="如: vod/down.html">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">展示模板：</label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" value="" name="type_show_tpl" placeholder="">
                        </div>
                        <label class="layui-form-label">阅读模板：</label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" value="" name="type_read_tpl" placeholder="">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">扩展配置：</label>
                        <div class="layui-input-block">
                            <textarea name="type_extend" class="layui-textarea" placeholder="JSON格式扩展配置" style="height:80px;"></textarea>
                        </div>
                    </div>
                </div>

                <div class="layui-tab-item">
                    <div class="layui-form-item">
                        <label class="layui-form-label">SEO标题：</label>
                        <div class="layui-input-block">
                            <input type="text" class="layui-input" value="" name="type_title" placeholder="留空则使用分类名称">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">SEO关键词：</label>
                        <div class="layui-input-block">
                            <input type="text" class="layui-input" value="" name="type_key" placeholder="多个关键词用逗号分隔">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">SEO描述：</label>
                        <div class="layui-input-block">
                            <textarea name="type_des" class="layui-textarea" placeholder="分类描述" style="height:80px;"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item center">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit="" lay-filter="formSubmit">保存</button>
                <button class="layui-btn layui-btn-warm" type="reset">重置</button>
                <button type="button" class="layui-btn layui-btn-normal" onclick="history.back()">返回</button>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript" src="/js/app.js"></script>
<script>
    var itemId = getQueryParam('id');

    // 加载父分类列表
    function loadParentTypes() {
        API.get('/admin/type/list').then(function(r) {
            if (r.code === 1 && r.data) {
                var list = Array.isArray(r.data) ? r.data : (r.data.list || []);
                var select = document.getElementById('type_pid');
                select.innerHTML = '<option value="0">无（顶级分类）</option>';
                list.forEach(function(vo) {
                    if (vo.type_pid == 0) {
                        select.innerHTML += '<option value="' + vo.type_id + '">' + vo.type_name + '</option>';
                    }
                });
                layui.use('form', function() { layui.form.render('select'); });
                // 如果是编辑模式，重新加载详情以设置选中值
                if (itemId) loadDetail();
            }
        });
    }

    function loadDetail() {
        if (!itemId) return;
        API.get('/admin/type/detail/' + itemId).then(function(r) {
            if (r.code === 1 && r.data) {
                var info = r.data;
                var f = document.getElementById('editForm');
                Object.keys(info).forEach(function(k) {
                    var el = f.querySelector('[name="' + k + '"]');
                    if (el) {
                        if (el.type === 'checkbox') el.checked = !!info[k];
                        else if (el.type === 'radio') {
                            f.querySelectorAll('[name="' + k + '"]').forEach(function(rd) {
                                rd.checked = (rd.value == info[k]);
                            });
                        } else el.value = info[k] || '';
                    }
                });
                layui.use('form', function() { layui.form.render(); });
            }
        });
    }

    loadParentTypes();

    bindForm('editForm', '/admin/type/save', function(r) {
        if (!itemId && r.data && r.data.type_id) {
            itemId = r.data.type_id;
            document.getElementById('type_id').value = itemId;
            window.history.replaceState({}, '', 'info.html?id=' + itemId);
        }
    });
</script>
</body>
</html>
