<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.site_name}} - 影视</title>
<link rel="stylesheet" href="/static/css/main.css" />
<style>
  :root{--primary:#e74c3c;--primary-dark:#c0392b;--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--text:#eee;--muted:#888;--border:#2a2a2a;--radius:8px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px}
  a{color:var(--text);text-decoration:none;transition:color .2s}
  a:hover{color:var(--primary)}
  .container{max-width:1200px;margin:0 auto;padding:0 16px}
  .site-header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
  .header-inner{display:flex;align-items:center;height:60px;gap:24px}
  .logo{font-size:22px;font-weight:700;color:var(--primary);white-space:nowrap}
  .logo span{color:var(--text);font-weight:400;font-size:14px;margin-left:4px}
  .nav{display:flex;gap:4px}
  .nav a{padding:8px 14px;border-radius:var(--radius);font-size:13px;color:var(--muted);transition:all .2s}
  .nav a:hover,.nav a.active{color:#fff;background:rgba(231,76,60,.15)}
  .search-box{margin-left:auto;display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:0 4px 0 14px;overflow:hidden}
  .search-box input{background:none;border:none;color:var(--text);padding:8px 0;width:180px;outline:none;font-size:13px}
  .search-box input::placeholder{color:#555}
  .search-box button{background:var(--primary);border:none;color:#fff;padding:6px 14px;border-radius:16px;cursor:pointer;font-size:12px}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:32px 0 16px}
  .section-title h2{font-size:18px;font-weight:600;position:relative;padding-left:14px}
  .section-title h2::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:3px;background:var(--primary);border-radius:2px}
  .section-title a{font-size:12px;color:var(--muted)}
  .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .video-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s}
  .video-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .video-card .thumb{position:relative;padding-top:140%;overflow:hidden;background:#222}
  .video-card .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
  .video-card .thumb .badge{position:absolute;top:8px;left:8px;background:var(--primary);color:#fff;font-size:10px;padding:2px 6px;border-radius:3px}
  .video-card .thumb .score{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);color:#ffd700;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px}
  .video-card .thumb .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:rgba(231,76,60,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
  .video-card:hover .play-icon{opacity:1}
  .video-card .play-icon::after{content:'';border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
  .video-card .info{padding:12px}
  .video-card .info h3{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .video-card .info .meta{font-size:11px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .site-footer{margin-top:60px;padding:40px 0;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:12px}
  .footer-links{display:flex;justify-content:center;gap:20px;margin-bottom:16px}
  .footer-links a{color:var(--muted);font-size:12px}
  @media(max-width:768px){
    .container{padding:0 12px}
    .header-inner{flex-wrap:wrap;height:auto;padding:10px 0;gap:6px}
    .logo{font-size:18px}
    .nav{order:3;width:100%;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;gap:2px;padding-bottom:4px}
    .nav a{padding:6px 10px;font-size:12px;flex-shrink:0}
    .search-box{order:2;flex:1;min-width:0}
    .search-box input{width:100%;font-size:14px;padding:10px 0}
    .video-grid{grid-template-columns:repeat(2,1fr);gap:8px}
    .video-card .info{padding:8px}
    .video-card .info h3{font-size:12px}
    .section-title{margin:20px 0 10px}
    .section-title h2{font-size:15px;padding-left:10px}
  }
</style>
</head>
<body>
<header class="site-header">
<div class="container">
<div class="header-inner">
  <a href="/" class="logo">{{.site_name}}<span>影视</span></a>
  <nav class="nav">
    <a href="/" class="active">首页</a>
    {{range .types}}<a href="/vodtype/{{.TypeID}}">{{.TypeName}}</a>{{end}}
  </nav>
  <form class="search-box" action="/vodsearch" method="get">
    <input type="text" name="wd" placeholder="搜索影片..." />
    <button type="submit">搜索</button>
  </form>
</div>
</div>
</header>
