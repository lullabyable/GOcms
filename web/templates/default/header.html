<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{$title}-{$site_name}</title>
<meta name="keywords" content="{$site_keywords}" />
<meta name="description" content="{$site_description}" />
<link rel="stylesheet" href="/static/css/main.css" />
<style>
  :root{--primary:#e74c3c;--primary-dark:#c0392b;--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--text:#eee;--muted:#888;--border:#2a2a2a;--radius:8px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px}
  a{color:var(--text);text-decoration:none;transition:color .2s}
  a:hover{color:var(--primary)}
  .container{max-width:1200px;margin:0 auto;padding:0 16px}
  /* Header */
  .site-header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
  .header-inner{display:flex;align-items:center;height:60px;gap:24px}
  .logo{font-size:22px;font-weight:700;color:var(--primary);white-space:nowrap}
  .logo span{color:var(--text);font-weight:400;font-size:14px;margin-left:4px}
  .nav{display:flex;gap:4px}
  .nav a{padding:8px 14px;border-radius:var(--radius);font-size:13px;color:var(--muted);transition:all .2s}
  .nav a:hover,.nav a.active{color:#fff;background:rgba(231,76,60,.15)}
  .search-box{margin-left:auto;display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:0 4px 0 14px;overflow:hidden}
  .search-box input{background:none;border:none;color:var(--text);padding:8px 0;width:180px;outline:none;font-size:13px}
  .search-box input::placeholder{color:#555}
  .search-box button{background:var(--primary);border:none;color:#fff;padding:6px 14px;border-radius:16px;cursor:pointer;font-size:12px}
  .user-area{display:flex;align-items:center;gap:12px;margin-left:12px}
  .user-area a{font-size:13px;color:var(--muted)}
  /* Footer */
  .site-footer{margin-top:60px;padding:40px 0;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:12px}
  .footer-links{display:flex;justify-content:center;gap:20px;margin-bottom:16px}
  .footer-links a{color:var(--muted);font-size:12px}
  /* Section title */
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:32px 0 16px}
  .section-title h2{font-size:18px;font-weight:600;position:relative;padding-left:14px}
  .section-title h2::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:3px;background:var(--primary);border-radius:2px}
  .section-title a{font-size:12px;color:var(--muted)}
  /* Video grid */
  .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .video-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s}
  .video-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .video-card .thumb{position:relative;padding-top:140%;overflow:hidden;background:#222}
  .video-card .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
  .video-card .thumb .badge{position:absolute;top:8px;left:8px;background:var(--primary);color:#fff;font-size:10px;padding:2px 6px;border-radius:3px}
  .video-card .thumb .score{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);color:#ffd700;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px}
  .video-card .thumb .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:rgba(231,76,60,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
  .video-card:hover .play-icon{opacity:1}
  .video-card .play-icon::after{content:'';border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
  .video-card .info{padding:12px}
  .video-card .info h3{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .video-card .info .meta{font-size:11px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Pagination */
  .pagination{display:flex;justify-content:center;gap:6px;margin:32px 0}
  .pagination a,.pagination span{padding:8px 14px;background:var(--surface);border-radius:var(--radius);font-size:13px;color:var(--muted);transition:all .2s}
  .pagination a:hover,.pagination span.current{background:var(--primary);color:#fff}
  /* Detail page */
  .detail-header{display:flex;gap:24px;margin-bottom:32px}
  .detail-poster{width:240px;flex-shrink:0;border-radius:var(--radius);overflow:hidden}
  .detail-poster img{width:100%;display:block}
  .detail-info{flex:1}
  .detail-info h1{font-size:24px;font-weight:700;margin-bottom:12px}
  .detail-info .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .detail-info .tags span{background:var(--surface2);padding:4px 10px;border-radius:4px;font-size:12px;color:var(--muted)}
  .detail-info .meta-list{display:grid;grid-template-columns:80px 1fr;gap:8px 16px;font-size:13px}
  .detail-info .meta-list dt{color:var(--muted)}
  .detail-info .meta-list dd{color:var(--text)}
  .detail-info .btn-group{display:flex;gap:10px;margin-top:24px}
  .btn{padding:10px 28px;border-radius:var(--radius);font-size:14px;font-weight:500;border:none;cursor:pointer;transition:all .2s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark);color:#fff}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
  /* Tabs */
  .tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
  .tabs a{padding:12px 20px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s}
  .tabs a:hover,.tabs a.active{color:var(--primary);border-bottom-color:var(--primary)}
  /* Play source */
  .play-sources{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .play-sources a{padding:8px 16px;background:var(--surface);border-radius:var(--radius);font-size:13px;color:var(--muted);transition:all .2s}
  .play-sources a:hover,.play-sources a.active{background:var(--primary);color:#fff}
  /* Player */
  .player-wrap{position:relative;padding-top:56.25%;background:#000;border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
  .player-wrap iframe,.player-wrap video{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
  /* Search */
  .search-result-count{font-size:13px;color:var(--muted);margin-bottom:16px}
  /* Sidebar */
  .main-layout{display:flex;gap:24px;margin-top:24px}
  .main-content{flex:1;min-width:0}
  .sidebar{width:300px;flex-shrink:0}
  .sidebar-widget{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .sidebar-widget h3{font-size:15px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .rank-list{list-style:none}
  .rank-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
  .rank-list li:last-child{border:none}
  .rank-list .rank{width:22px;height:22px;border-radius:4px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .rank-list li:nth-child(1) .rank{background:var(--primary);color:#fff}
  .rank-list li:nth-child(2) .rank{background:#e67e22;color:#fff}
  .rank-list li:nth-child(3) .rank{background:#f1c40f;color:#333}
  .rank-list a{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  /* Responsive */
  @media(max-width:768px){
    .header-inner{flex-wrap:wrap;height:auto;padding:12px 0;gap:8px}
    .nav{order:3;width:100%;overflow-x:auto;white-space:nowrap}
    .search-box{order:2;flex:1}
    .user-area{display:none}
    .video-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .detail-header{flex-direction:column}
    .detail-poster{width:160px}
    .main-layout{flex-direction:column}
    .sidebar{width:100%}
  }
</style>
</head>
<body>
<header class="site-header">
<div class="container">
<div class="header-inner">
  <a href="/" class="logo">{$site_name}<span>影视</span></a>
  <nav class="nav">
    <a href="/" class="active">首页</a>
    {maccms:type parent="0" order="sort_asc" by="sort"}
    <a href="/vodtype/{$vo.type_id}">{$vo.type_name}</a>
    {/maccms:type}
  </nav>
  <form class="search-box" action="/vodsearch" method="get">
    <input type="text" name="wd" placeholder="搜索影片..." />
    <button type="submit">搜索</button>
  </form>
  <div class="user-area">
    <select onchange="setTheme(this.value)" style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:4px;font-size:11px;cursor:pointer">
      <option value="red">🔴 经典红</option>
      <option value="blue">🔵 深海蓝</option>
      <option value="purple">🟣 霓虹紫</option>
      <option value="green">🟢 翡翠绿</option>
      <option value="gold">🟡 暖金色</option>
    </select>
    <a href="/user/login">登录</a>
    <a href="/user/register">注册</a>
  </div>
</div>
</div>
</header>
