{{template "partials/header.html" .}}

<main class="container" style="margin-top:24px">

<div style="background:var(--surface);border-radius:var(--radius);overflow:hidden;margin-bottom:24px">
  {{if .topic.TopicPic}}
  <div style="position:relative;padding-top:40%;overflow:hidden;background:#222">
    <img src="{{.topic.TopicPic}}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover" />
  </div>
  {{end}}
  <div style="padding:24px">
    <h1 style="font-size:22px;font-weight:600;margin-bottom:12px">{{.topic.TopicName}}</h1>
    {{if .topic.TopicContent}}
    <div style="font-size:14px;color:var(--muted);line-height:2">{{.topic.TopicContent}}</div>
    {{end}}
  </div>
</div>

{{if .vods}}
<section class="section-title">
  <h2>相关视频</h2>
</section>
<div class="video-grid">
  {{range .vods}}
  <div class="video-card">
    <a href="/voddetail/{{.ID}}">
      <div class="thumb">
        <img src="{{.VodPic}}" alt="{{.VodName}}" loading="lazy" />
        <span class="badge">{{.VodRemarks}}</span>
        <div class="play-icon"></div>
      </div>
      <div class="info">
        <h3>{{.VodName}}</h3>
        <div class="meta">{{.VodYear}} · {{.VodArea}}</div>
      </div>
    </a>
  </div>
  {{end}}
</div>
{{end}}

</main>

{{template "partials/footer.html" .}}
