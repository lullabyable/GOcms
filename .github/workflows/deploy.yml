name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        run: |
          go mod download
          go build -o gocms ./cmd/server

      - name: Restart
        run: sudo systemctl restart gocms
